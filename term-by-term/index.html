<style>
html { -webkit-text-size-adjust: 100%; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one reading column, like an index card on a desk. Home = today's card + an 87-day course map; lesson, quiz and results each take the whole column. */
:root {
  --paper: #F4F5F8;
  --surface: #FFFFFF;
  --ink: #1A2140;
  --muted: #5A6277;
  --rule: #DCE0E9;
  --accent: #2A3D9C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6E9F7;
  --hl: rgba(255, 219, 51, 0.72);
  --hl-solid: #FFD933;
  --good: #1B7548;
  --good-bg: #E2F2E9;
  --bad: #C2382A;
  --bad-bg: #FBE7E4;
  --f-display: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141D; --surface: #191E2B; --ink: #E8EBF3; --muted: #A2AABD; --rule: #2B3243;
    --accent: #93A5FF; --accent-ink: #0D1120; --accent-soft: #232B46;
    --hl: rgba(240, 200, 40, 0.34); --hl-solid: #E9C53A;
    --good: #62D29C; --good-bg: rgba(98, 210, 156, 0.13); --bad: #FF7D6C; --bad-bg: rgba(255, 125, 108, 0.13);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141D; --surface: #191E2B; --ink: #E8EBF3; --muted: #A2AABD; --rule: #2B3243;
  --accent: #93A5FF; --accent-ink: #0D1120; --accent-soft: #232B46;
  --hl: rgba(240, 200, 40, 0.34); --hl-solid: #E9C53A;
  --good: #62D29C; --good-bg: rgba(98, 210, 156, 0.13); --bad: #FF7D6C; --bad-bg: rgba(255, 125, 108, 0.13);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 56px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 650; font-size: 1.25rem; letter-spacing: -0.01em; background: none; border: 0; padding: 0; cursor: pointer; }
.brand span { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 90%, transparent 90%); padding: 0 2px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.92rem; color: var(--muted); }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--paper); }

/* shared bits */
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; font-weight: 700; cursor: pointer; font-size: 1rem; line-height: 1.2; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.secondary { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: none; border-color: var(--rule); color: var(--ink); }
.btn.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }

/* today */
.today h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 0.92rem; background: var(--paper); }
.score-inline { font-family: var(--f-hand); color: var(--bad); font-size: 1.7rem; line-height: 1; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.45rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.82rem; color: var(--muted); }
.mapwrap { display: flex; flex-direction: column; gap: 10px; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(20px, 1fr)); gap: 5px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 5px; border: 1px solid var(--rule); background: var(--surface); padding: 0; }
.cell.done { background: var(--ink); border-color: var(--ink); cursor: pointer; }
.cell.done:hover { background: var(--accent); border-color: var(--accent); }
.cell.now { background: var(--hl-solid); border-color: var(--hl-solid); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--rule); background: var(--surface); }
.legend i.d { background: var(--ink); border-color: var(--ink); }
.legend i.n { background: var(--hl-solid); border-color: var(--hl-solid); }
.foot { display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 16px; }
.confirm { background: var(--bad-bg); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.btn.danger { background: var(--bad); color: var(--surface); }

/* lesson */
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.entry { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: clamp(20px, 5vw, 34px); display: flex; flex-direction: column; gap: 18px; }
.headword { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 650; letter-spacing: -0.015em; }
.headword span { background: linear-gradient(transparent 56%, var(--hl) 56%, var(--hl) 92%, transparent 92%); padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.aka { color: var(--muted); font-style: italic; margin-top: -8px; }
.def { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.5; max-width: 60ch; }
.example { margin: 0; border-left: 3px solid var(--hl-solid); padding: 4px 0 4px 16px; display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.example p { font-family: var(--f-display); font-style: italic; font-size: 1.08rem; }
.why { display: flex; flex-direction: column; gap: 4px; background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); }
.dots i.on { background: var(--accent); }
.navrow { display: flex; justify-content: space-between; gap: 10px; }

/* quiz */
.bar { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tag.review { background: var(--hl); color: var(--ink); }
.qtext { font-family: var(--f-display); font-size: 1.22rem; line-height: 1.5; }
.qtext.ex { font-style: italic; border-left: 3px solid var(--hl-solid); padding-left: 16px; }
.qtext.term { font-size: clamp(1.8rem, 7vw, 2.4rem); font-style: normal; font-weight: 650; }
.options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 12px; padding: 13px 14px; cursor: pointer; font-size: 1.02rem; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; background: var(--paper); border: 1px solid var(--rule); color: var(--muted); }
.opt .txt { min-width: 0; }
.opt.defopt { font-size: 0.97rem; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .key { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt.wrong .txt { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.feedback { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--rule); background: var(--surface); }
.feedback .verdict { font-weight: 700; }
.feedback .verdict.ok { color: var(--good); }
.feedback .verdict.no { color: var(--bad); }

/* results */
.mark { font-family: var(--f-hand); color: var(--bad); font-size: 4.6rem; line-height: 0.9; transform: rotate(-4deg); display: inline-block; }
.tally { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.tally li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.tally .nm { font-weight: 700; min-width: 0; }
.tally .res { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.res.ok { color: var(--good); }
.res.no { color: var(--bad); }

/* glossary */
.search { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); font: inherit; }
.search:focus { border-color: var(--accent); outline: none; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: 0.9rem; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.glist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.glist details { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.glist summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.glist summary::-webkit-details-marker { display: none; }
.glist summary .nm { font-family: var(--f-display); font-weight: 650; font-size: 1.08rem; min-width: 0; }
.glist summary .meta { flex: none; font-size: 0.8rem; color: var(--muted); }
.glist .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.pill { font-family: var(--f-body); font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-left: 6px; }
.pill.shaky { background: var(--bad-bg); color: var(--bad); }
.pill.solid { background: var(--good-bg); color: var(--good); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

@media (max-width: 440px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 10px; }
  .stat b { font-size: 1.2rem; }
  .card { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<script type="application/json" id="days-data">[{"title":"Comparisons and pictures","terms":[{"t":"Metaphor","d":"Describing something as if it actually is something else, without using “like” or “as”.","e":"“Her words were knives, and every one found its mark.”","f":"Fuses two ideas so the reader feels the qualities of one inside the other — ask what the comparison suggests."},{"t":"Simile","d":"A comparison between two different things using “like” or “as”.","e":"“His voice was like gravel tumbling round a cement mixer.”","f":"Makes a quality concrete and vivid; the thing chosen for the comparison reveals the writer’s attitude."},{"t":"Personification","d":"Giving human feelings, actions or qualities to something that is not human.","e":"“The old house groaned as the wind shouldered against its walls.”","f":"Makes objects and settings feel alive — hostile, comforting or sympathetic.","x":["Metaphor"]},{"t":"Imagery","d":"Descriptive language that appeals to the senses and builds a picture in the reader’s mind.","e":"“The kitchen smelled of burnt toast; sunlight striped the sticky table and the radio crackled.”","f":"Pulls the reader into a scene and sets the mood — notice which senses dominate and why.","a":["sensory language"]},{"t":"Symbolism","d":"Using an object, colour or image to stand for a larger, abstract idea.","e":"Every time the family argues, the camera returns to the cracked mirror in the hallway.","f":"Lets a writer carry an idea like guilt, hope or loss through something the reader can see."}]},{"title":"The five senses","terms":[{"t":"Visual Imagery","d":"Description that appeals to sight — colour, light, shape and movement.","e":"“Neon signs spilled pink and green light across the wet pavement.”","f":"Colour and light often signal mood: bright for hope, grey for despair."},{"t":"Auditory Imagery","d":"Description that appeals to hearing.","e":"“Somewhere below, a dog barked twice, a door slammed, and the radiator ticked in the dark.”","f":"Sound builds tension or calm — and a silence the writer points out is often a warning."},{"t":"Olfactory Imagery","d":"Description that appeals to smell.","e":"“The hallway reeked of wet coats, boiled cabbage and cheap perfume.”","f":"Smell is tied to memory, so it is often used for nostalgia or disgust."},{"t":"Gustatory Imagery","d":"Description that appeals to taste.","e":"“The coffee was bitter and burnt, but the honey left a slow sweetness on her tongue.”","f":"Makes pleasure, disgust or bitterness physical for the reader."},{"t":"Tactile Imagery","d":"Description that appeals to touch — texture, temperature and pressure.","e":"“The banister was cold and sticky, and a splinter snagged her palm.”","f":"Makes the reader feel physically present in a scene — discomfort, warmth or danger."}]},{"title":"The sound of words","terms":[{"t":"Alliteration","d":"Repeating the same consonant sound at the start of nearby words.","e":"“Big, brutal boots bounded across the bridge.”","f":"Draws attention and adds rhythm; hard sounds (b, k, d) feel aggressive, soft ones (l, m, w) gentler."},{"t":"Assonance","d":"Repeating the same vowel sound in nearby words.","e":"“He feeds the geese beside the creek each evening.”","f":"Creates an internal music; long vowels slow a line down, short ones speed it up."},{"t":"Consonance","d":"Repeating the same non-vowel sounds inside or at the ends of nearby words.","e":"“Old, wild, mad and bored, the crowd stood and glared.”","f":"Knits a line together with a subtle echo; hard repeated endings can feel heavy or final."},{"t":"Onomatopoeia","d":"A word that imitates the sound it describes.","e":"“The kettle gurgled, the toaster pinged, and somewhere a dog went woof.”","f":"Lets the reader hear the scene directly — often used for action, comedy or immediacy."},{"t":"Sibilance","d":"Repeating “s” and “sh” sounds, often creating a hissing, whispering or soothing effect.","e":"“Silken sheets slipped across the sleeping girl’s shoulders.”","f":"Can feel soft and soothing or sinister and snake-like, depending on context.","x":["Alliteration","Consonance"]}]},{"title":"Tone and word choice","terms":[{"t":"Tone","d":"The writer’s or speaker’s attitude towards the subject or audience — mocking, tender, bitter, admiring.","e":"The closure of an old cinema can be written with grief (“our beloved Regal is gone”) or with relief (“that mouldy fleapit is finally shut”).","f":"Always name the tone precisely and show which words create it.","n":1},{"t":"Mood","d":"The feeling a text creates in the reader — tense, eerie, joyful, melancholy.","e":"Rusted rides creak in the wind and a single bulb flickers over the empty fairground; the reader feels uneasy.","f":"Tone is the writer’s attitude; mood is what the reader is made to feel.","n":1},{"t":"Diction","d":"A writer’s choice of words — formal or informal, simple or complex, precise or vague.","e":"A legal letter uses “hereinafter” and “pursuant to”; a text to a friend uses “gonna” and “lol”.","f":"Word choice reveals register, character and attitude: always ask why this word and not another."},{"t":"Connotation","d":"The associations and feelings a word carries beyond its literal meaning.","e":"“Home” suggests warmth, safety and belonging; “house” just names a building.","f":"The emotional charge of words is how writers steer readers without saying so directly."},{"t":"Denotation","d":"The literal, dictionary meaning of a word.","e":"Strip away the danger and betrayal we link with “snake” and you are left with “a long, legless reptile”.","f":"Comparing a word’s literal meaning with its associations is the first step of close analysis."}]},{"title":"Turning it up and down","terms":[{"t":"Hyperbole","d":"Deliberate, extreme exaggeration that is not meant to be taken literally.","e":"“I’ve told you a million times — and this bag weighs a ton.”","f":"Signals strong feeling, humour or urgency; in adverts it builds excitement.","a":["overstatement","exaggeration"]},{"t":"Understatement","d":"Presenting something as smaller or less serious than it really is.","e":"After the hurricane flattened his house, he said, “Bit of a rough week.”","f":"Creates dry humour, modesty or shock — the gap between the event and the words does the work.","a":["meiosis"]},{"t":"Litotes","d":"Understatement by denying the opposite — saying “not bad” to mean “good”.","e":"“Winning the lottery wasn’t the worst thing that ever happened to him.”","f":"Sounds modest or ironic while quietly emphasising the point.","x":["Understatement"]},{"t":"Euphemism","d":"A mild or polite word used in place of something harsh, painful or embarrassing.","e":"“Unfortunately, we’ve had to let some of our staff go.”","f":"Softens reality — and can be used to hide it, so ask who benefits."},{"t":"Dysphemism","d":"A harsh or offensive word used in place of a neutral one.","e":"He calls the school canteen “the slop trough” and the head teacher “the warden”.","f":"Shows contempt or toughness, or shocks the reader into seeing something differently.","x":["Hyperbole"]}]},{"title":"Opposites and contradictions","terms":[{"t":"Juxtaposition","d":"Placing two contrasting things side by side to highlight their differences.","e":"The billionaire’s yacht glittered in the harbour, a few metres from the tents of the homeless.","f":"Forces the reader to compare — the contrast itself becomes the argument."},{"t":"Antithesis","d":"Setting opposite ideas against each other in a balanced, parallel structure.","e":"“They came as liberators; they left as conquerors.”","f":"Makes a contrast sharp and quotable — a favourite of speeches and slogans.","x":["Juxtaposition"]},{"t":"Oxymoron","d":"Two contradictory words placed together.","e":"“a deafening silence”, “bittersweet”, “an open secret”","f":"Squeezes a complex or conflicted feeling into a single phrase."},{"t":"Paradox","d":"A statement that seems to contradict itself but reveals a deeper truth.","e":"“The more you learn, the more you realise how little you know.”","f":"Makes the reader stop and work out the truth hidden inside the contradiction."},{"t":"Contrast","d":"Any difference between two things that a writer deliberately sets up for effect.","e":"The novel opens in a sunny, bustling village and ends in the same village, silent and grey.","f":"Umbrella term: name the specific technique (juxtaposition, antithesis, foil) where you can.","n":1,"u":1}]},{"title":"Irony","terms":[{"t":"Irony","d":"A gap between what is said or expected and what is meant or actually happens.","e":"A fire station burns down; a speaker shouts “I love peace and quiet!”; the audience knows the cup is poisoned but the hero doesn’t.","f":"Creates distance — humour, bitterness or tragedy — and lets readers see more than the characters.","n":1,"u":1},{"t":"Verbal Irony","d":"Saying something different from — often the opposite of — what you really mean.","e":"Stepping out into a hailstorm, Leo grinned: “Perfect beach weather.”","f":"Lets a speaker be witty or critical without saying so outright.","x":["Sarcasm"]},{"t":"Situational Irony","d":"When what happens is the opposite of what was expected.","e":"The safety inspector slips on a wet floor halfway through his talk on preventing falls.","f":"Highlights the gap between intention and outcome — comic or tragic."},{"t":"Dramatic Irony","d":"When the audience knows something a character does not.","e":"We know the killer is behind the curtain; the heroine sighs, “At last, I’m safe.”","f":"Builds tension, dread or comedy as we wait for the character to find out."},{"t":"Sarcasm","d":"Mocking, often bitter remarks that say the opposite of what is meant, usually to wound.","e":"“Oh, brilliant work,” he sneered as his brother dropped the wedding cake. “Truly a genius.”","f":"Reveals hostility or contempt — it tells us about the speaker as much as the target.","x":["Verbal Irony"]}]},{"title":"Persuasive patterns","terms":[{"t":"Anaphora","d":"Repeating the same word or phrase at the start of successive clauses or lines.","e":"“Every street we walked, every café we tried, every bench we sat on, every song we heard — it all reminds me of you.”","f":"Builds rhythm and emotional pressure; hammers a point home."},{"t":"Epistrophe","d":"Repeating the same word or phrase at the end of successive clauses or lines.","e":"“You lied to the press. The board lied to the press. Even my own lawyer lied to the press.”","f":"Leaves the repeated words ringing in the reader’s ear.","a":["epiphora"],"x":["Tricolon"]},{"t":"Tricolon","d":"A series of three parallel words, phrases or clauses.","e":"“Cheap food, quick service, excellent coffee.”","f":"Three feels complete and memorable — beloved of speeches and adverts."},{"t":"Rhetorical Question","d":"A question asked for effect, not because an answer is expected.","e":"“Who among us doesn’t want a safer world for our children?”","f":"Involves the audience and nudges them towards the ‘obvious’ answer."},{"t":"Repetition","d":"Using the same word, phrase, sound or idea more than once for emphasis.","e":"“Nothing, nothing, nothing was left.” Any deliberate repeat counts, from one word to a whole refrain.","f":"Umbrella term: say which kind of repetition it is and what it emphasises.","n":1,"u":1}]},{"title":"The persuasive appeals","terms":[{"t":"Ethos","d":"Persuading by establishing the speaker’s credibility, expertise or good character.","e":"“As a doctor who has worked in A&E for twenty years, I can tell you this policy will cost lives.”","f":"If the audience trusts the speaker, they trust the message."},{"t":"Pathos","d":"Persuading by appealing to the audience’s emotions.","e":"“Imagine your little sister, alone and frightened, waiting for help that never comes.”","f":"Moves people to act through pity, fear, anger or hope."},{"t":"Logos","d":"Persuading through logic, facts, statistics and reasoning.","e":"“Cycling to school saves the average family £300 a year and cuts journey times by twelve minutes.”","f":"Makes an argument feel objective and hard to dismiss."},{"t":"Kairos","d":"Choosing the right moment — and adapting to it — so an argument lands.","e":"Days after record floods, an environmental charity launches its climate campaign.","f":"Timing makes an audience receptive; the same message can fail at the wrong moment."},{"t":"Audience","d":"The people a text is aimed at, whose needs and expectations shape its content and style.","e":"A charity advert in a parenting magazine uses babies and soft colours; its poster at a tech conference uses data and sleek graphics.","f":"Ask who the text is for — it explains almost every choice the writer makes."}]},{"title":"Who tells the story","terms":[{"t":"Narrator","d":"The voice that tells a story — a character inside it or a voice outside it.","e":"“My father’s family name being Pirrip, and my Christian name Philip…” — in Great Expectations, grown-up Pip tells his own story.","f":"Ask how much the narrator knows, how reliable they are and what they want us to think.","n":1},{"t":"Point of View","d":"The position a story is told from — first person (“I”), second (“you”) or third (“he”, “she”, “they”).","e":"“I opened the door” versus “She opened the door” — the same event at a different distance.","f":"Controls how close we get to a character and whose version we trust.","n":1},{"t":"Omniscient","d":"A narrator who knows everything — every character’s thoughts, the past and the future.","e":"The mayor smiled, hiding his terror; his wife was planning her escape; and the gardener had already posted the letter that would ruin them both.","f":"Gives a god-like overview — useful for irony and tension.","x":["Point of View","Narrator"]},{"t":"Stream of Consciousness","d":"Writing that follows a character’s thoughts as they flow — jumping, associative, loosely punctuated.","e":"“Must buy milk — her eyes, that green, like the sea at Brighton, Dad’s old car, petrol, the smell — milk, yes, and bread.”","f":"Puts us inside a mind and mimics how thinking really works.","x":["Point of View","Narrator"]},{"t":"Speaker","d":"The voice talking in a poem — not necessarily the poet.","e":"In a poem written by a sixty-year-old woman, the “I” is a young soldier writing home from the trenches.","f":"Separating speaker from poet lets you analyse the voice as a constructed character.","x":["Narrator"]}]},{"title":"Playing with time","terms":[{"t":"Foreshadowing","d":"Hints or clues about what will happen later.","e":"Early on, a character jokes that he would “never survive a winter in those mountains”; in the final chapter, he freezes there.","f":"Builds anticipation and makes endings feel inevitable.","x":["Flash-Forward"]},{"t":"Flashback","d":"A scene that interrupts the present to show events from the past.","e":"A car backfires and the soldier is suddenly back in his village on the day it was bombed.","f":"Reveals backstory and motivation — often triggered by a sensory detail."},{"t":"Flash-Forward","d":"A jump ahead in time to show events that will happen later.","e":"In the middle of the wedding, the narrator tells us: “Ten years later, she would burn every photo from that day.”","f":"Creates suspense: we know what happens, so now we need to know why.","x":["Foreshadowing"]},{"t":"In Medias Res","d":"Starting a story in the middle of the action.","e":"The film opens with the heist already going wrong — alarms screaming, the getaway car gone.","f":"Hooks the audience instantly; the background comes later.","x":["Flashback"]},{"t":"Cliffhanger","d":"Ending a chapter or episode at a moment of high suspense with the outcome unresolved.","e":"Episode four ends with a knock at the door and the detective whispering, “It’s him.” Cut to black.","f":"Makes the audience desperate to keep reading or watching."}]},{"title":"The shape of a plot","terms":[{"t":"Exposition","d":"The opening part of a story that introduces the characters, setting and background.","e":"The first chapters introduce the sleepy fishing village, the widowed baker and her two sons, and the old feud with the mill owner.","f":"Look at what the writer chooses to tell us first — and what they hold back."},{"t":"Inciting Incident","d":"The event that sets the main plot in motion.","e":"The baker’s son finds a stranger washed up on the beach with a map in his pocket.","f":"Disrupts the normal world and gives the protagonist a goal or problem."},{"t":"Rising Action","d":"The chain of events that builds tension towards the climax.","e":"The brothers follow the map, quarrel, are betrayed by the mill owner and lose their boat.","f":"Complications raise the stakes and keep the reader invested."},{"t":"Climax","d":"The point of greatest tension, where the main conflict comes to a head.","e":"On the burning pier, the son finally confronts the mill owner face to face.","f":"The moment everything has been building towards; often reveals what the story is really about."},{"t":"Resolution","d":"The part where the conflict is settled and a new normal begins.","e":"The feud ends, the village rebuilds the pier, and the brothers open a bakery together.","f":"Shows what has changed — and what the writer wants us to take away."}]},{"title":"Big ideas and patterns","terms":[{"t":"Theme","d":"A central idea a text explores, such as power, identity or loss.","e":"Macbeth: unchecked ambition corrupts and destroys.","f":"Express themes as ideas about the subject, not single words — “ambition destroys”, not just “ambition”."},{"t":"Motif","d":"A recurring image, object, sound or idea that develops a theme.","e":"Blood keeps reappearing in Macbeth — on daggers, on hands, in visions — tracking the characters’ guilt.","f":"Tracing a pattern shows how meaning builds across a whole text."},{"t":"Allegory","d":"A story in which characters and events stand for something else, usually moral or political.","e":"Animal Farm retells the Russian Revolution as a rebellion of farm animals.","f":"Lets writers criticise real people and systems at a safe distance."},{"t":"Allusion","d":"A brief reference to a well-known person, place, event or text.","e":"“Buying that car was like opening Pandora’s box.”","f":"Packs a whole story’s worth of meaning into a few words — if the reader catches it."},{"t":"Archetype","d":"A universal character type, situation or symbol that recurs across cultures and stories.","e":"The wise old mentor who guides the young hero: Merlin, the fairy godmother, the hermit in the mountains.","f":"Taps into patterns readers recognise instantly — and lets writers subvert them."}]},{"title":"Speech on stage","terms":[{"t":"Soliloquy","d":"A speech in which a character alone on stage speaks their thoughts aloud.","e":"Alone on stage, Hamlet asks whether it is nobler to suffer life’s troubles or to end them.","f":"Gives the audience direct access to a character’s inner conflict.","x":["Monologue"]},{"t":"Aside","d":"A short remark a character makes to the audience that the other characters cannot hear.","e":"As the guest praises her cooking, the hostess turns to the audience: “I bought it from the shop.”","f":"Creates intimacy with the audience and often dramatic irony."},{"t":"Monologue","d":"A long speech by one character to others who are listening.","e":"At dinner, the father delivers a long, furious speech to his silent family about how hard he has worked for them.","f":"Lets a character dominate a scene — and reveals what drives them.","x":["Dramatic Monologue","Soliloquy"]},{"t":"Dialogue","d":"Conversation between two or more characters.","e":"“Where were you?” “Out.” “Out where?” “Just out, Mum.”","f":"Reveals relationships and conflict through what is said — and what is not."},{"t":"Dramatic Monologue","d":"A poem spoken by one character to a silent listener, revealing more than the speaker intends.","e":"In Browning’s “My Last Duchess”, a duke shows a visitor his late wife’s portrait and lets slip that he had her killed.","f":"Readers must read between the lines and judge the speaker.","x":["Monologue","Soliloquy"]}]},{"title":"Tragedy","terms":[{"t":"Tragedy","d":"A serious drama in which the main character suffers a downfall, usually ending in death.","e":"Romeo and Juliet: two young lovers, a family feud, a series of rash choices — and both dead by the end.","f":"Ask what the downfall says about the characters and the world they live in.","n":1},{"t":"Tragic Hero","d":"A noble, admired character whose own flaw or error brings about their downfall.","e":"Macbeth: a brave, respected general whose ambition drives him to murder and ruin.","f":"We admire and pity them, which makes their fall painful to watch.","x":["Tragedy"]},{"t":"Hamartia","d":"The fatal flaw or error of judgement that causes a tragic hero’s downfall.","e":"Othello’s jealousy, which leads him to murder the wife he loves.","f":"Shows how a hero’s best qualities can be bound up with their destruction.","a":["tragic flaw"]},{"t":"Catharsis","d":"The release of pity and fear the audience experiences at the end of a tragedy.","e":"The audience leaves the final scene shaken but strangely cleansed, their emotions spent.","f":"Aristotle’s explanation of why watching suffering can feel satisfying."},{"t":"Peripeteia","d":"A sudden reversal of fortune for the main character.","e":"In a single scene, the celebrated general is stripped of his command and thrown into prison.","f":"Marks the turning point from success to suffering."}]},{"title":"Character roles","terms":[{"t":"Protagonist","d":"The main character, whose goals drive the story.","e":"Elizabeth Bennet, whose choices and growth the whole of Pride and Prejudice follows.","f":"The story’s values are often tested through what happens to this character."},{"t":"Antagonist","d":"The character or force that opposes the main character.","e":"The scheming stepmother who blocks Cinderella at every turn.","f":"Creates the conflict; can be a person, society, nature or the self."},{"t":"Foil","d":"A character whose contrasting traits highlight another character’s qualities.","e":"Reckless, joking Mercutio makes dreamy, lovesick Romeo seem even more intense.","f":"Comparing the pair shows what the writer wants us to notice about each."},{"t":"Round Character","d":"A complex, believable character with many sides and contradictions.","e":"The grandmother is generous yet cruel to her daughter, brave in a crisis yet terrified of being alone.","f":"Feels like a real person and can surprise us."},{"t":"Flat Character","d":"A simple character built around one or two traits who never surprises us.","e":"Mr Collins is pompous and self-important in every single scene.","f":"Serves the story efficiently — and is often used for comedy or satire."}]},{"title":"How characters are built","terms":[{"t":"Characterization","d":"How a writer reveals character — especially indirectly, through actions, speech, thoughts and other people’s reactions.","e":"We are never told Mrs Hale is mean; we just watch her count the biscuits after every guest leaves.","f":"“Show, don’t tell”: readers infer character from evidence."},{"t":"Direct Characterization","d":"Telling the reader outright what a character is like.","e":"“Mr Grimsby was a greedy, cold-hearted man who had never given a penny to anyone.”","f":"Quick and clear, but asks the reader to trust the narrator’s judgement."},{"t":"Dynamic Character","d":"A character who changes significantly during the story.","e":"Scrooge begins as a miser who hates Christmas and ends by showering gifts on the people he ignored.","f":"The change usually carries the text’s message."},{"t":"Static Character","d":"A character who stays essentially the same from start to finish.","e":"Uncle Ted is the same grumpy, reliable mechanic on page 300 as on page one.","f":"Can provide stability — or show someone unable to change."},{"t":"Stereotype","d":"An oversimplified, widely held idea about a type of person.","e":"The nerdy scientist in thick glasses who can’t speak to anyone at parties.","f":"Easy shorthand that can be lazy or harmful; writers sometimes set one up in order to break it."}]},{"title":"Lines of poetry","terms":[{"t":"Stanza","d":"A group of lines in a poem, separated from others by a space — the poem’s paragraph.","e":"A poem built from four-line blocks, each separated by white space and each moving the story on.","f":"Look at how ideas are divided and where the breaks fall."},{"t":"Enjambment","d":"When a sentence runs on from one line of poetry to the next without a pause.","e":"“I waited by the gate until the light / went out across the hills, and I went home.”","f":"Creates momentum, surprise or a sense of overflow; the break can briefly change the meaning."},{"t":"Caesura","d":"A pause in the middle of a line of poetry, usually marked by punctuation.","e":"“To err is human; to forgive, divine.” (Alexander Pope)","f":"Interrupts the rhythm for emphasis, hesitation or shock."},{"t":"End-Stopped Line","d":"A line of poetry that ends with punctuation, completing a phrase or sentence.","e":"“The sun was gone. / The road was cold. / The house was dark.”","f":"Creates a measured, controlled or final-sounding rhythm."},{"t":"Volta","d":"The turn in a poem — a shift in argument, mood or perspective, especially in a sonnet.","e":"After eight lines praising a lover’s beauty, line nine begins “But” and the poem turns to the fear of losing her.","f":"Finding the turn shows how the poem’s thinking develops."}]},{"title":"Sentence structure","terms":[{"t":"Syntax","d":"The arrangement of words and phrases into sentences.","e":"“The man ran, terrified” versus “Terrified, the man ran” versus “He ran. Terrified.” — the same idea, three different effects.","f":"Look at sentence length, word order and structure: they control pace and emphasis.","n":1},{"t":"Asyndeton","d":"Leaving out conjunctions such as “and” between words or clauses.","e":"“She packed her bag, slammed the door, didn’t look back.”","f":"Speeds things up and creates urgency or relentlessness.","x":["Parallelism","Cumulative Sentence"]},{"t":"Polysyndeton","d":"Using many conjunctions in a row, especially “and”.","e":"“We ran and we laughed and we fell and we got up again.”","f":"Slows the pace and piles things up — breathless, overwhelming or childlike.","x":["Parallelism"]},{"t":"Parallelism","d":"Using the same grammatical structure for related words, phrases or clauses.","e":"“He was praised for his courage, admired for his honesty and loved for his kindness.”","f":"Creates balance and rhythm, and makes ideas feel connected.","a":["parallel structure"]},{"t":"Cumulative Sentence","d":"A sentence that states its main clause first and then adds details one after another.","e":"“She walked into the kitchen, her coat still dripping, her hands shaking, the letter crumpled in her fist.”","f":"Details pile up like a camera zooming in — mimicking how we notice or remember.","x":["Asyndeton","Parallelism"]}]},{"title":"Repetition with a twist","terms":[{"t":"Chiasmus","d":"Reversing the order of parallel ideas or structures in a mirror (ABBA) pattern.","e":"“By day the frolic, and the dance by night.” (Samuel Johnson)","f":"The mirror shape makes a line satisfying and memorable.","x":["Antimetabole"]},{"t":"Antimetabole","d":"Repeating the same words in reverse order in successive clauses.","e":"“Eat to live; don’t live to eat.”","f":"Flips an idea to make a clever, memorable point.","x":["Chiasmus"]},{"t":"Anadiplosis","d":"Repeating the last word of one clause at the start of the next.","e":"“The storm brought the flood; the flood brought the fear; the fear brought the silence.”","f":"Links ideas in a chain, suggesting cause and effect or escalation."},{"t":"Epizeuxis","d":"Repeating a word immediately, with nothing in between.","e":"“Run! Run, run, run!”","f":"Conveys urgency, panic or overwhelming emotion.","x":["Diacope"]},{"t":"Diacope","d":"Repeating a word or phrase with a few words in between.","e":"“Alone — utterly, hopelessly alone.”","f":"Emphasises a key word by returning to it after a brief detour.","x":["Epizeuxis"]}]},{"title":"Media and persuasion","terms":[{"t":"Bandwagon","d":"Persuading people to do something because everyone else supposedly is.","e":"“Join the two million students who already revise smarter with StudyPal!”","f":"Plays on the fear of missing out or being left behind."},{"t":"Propaganda","d":"Biased or misleading information spread to promote a political cause or point of view.","e":"A wartime poster shows the enemy as a snarling beast carrying off a crying woman.","f":"Ask who benefits and what has been left out.","x":["Bias"]},{"t":"Bias","d":"A one-sided preference that slants how information is presented.","e":"A newspaper owned by an oil company runs three stories on wind farms’ problems and none on their benefits.","f":"Shows up in what is included, left out and emphasised.","x":["Propaganda"]},{"t":"Buzzword","d":"A fashionable word or phrase that sounds impressive but is often vague.","e":"“Our synergy-driven, disruptive, next-gen platform empowers learners.”","f":"Makes something sound modern or expert without saying much.","x":["Jargon"]},{"t":"Jargon","d":"Specialised vocabulary used by a particular profession or group.","e":"“The patient presented with acute dyspnoea and bilateral crepitations.”","f":"Builds authority — or shuts outsiders out, depending on the audience.","x":["Buzzword"]}]},{"title":"Building an argument","terms":[{"t":"Claim","d":"A statement the writer wants the reader to accept as true.","e":"“School uniforms should be scrapped.”","f":"Every argument rests on these — check what supports each one.","x":["Thesis"]},{"t":"Evidence","d":"Facts, examples, statistics or quotations used to support a claim.","e":"“In our survey of 400 students, seven in ten said uniforms made no difference to their behaviour.”","f":"The strength of an argument depends on the quality of this support."},{"t":"Rebuttal","d":"A response that argues against an opposing point.","e":"“Critics say uniforms reduce bullying, but the bullying simply moves online.”","f":"Strengthens an argument by tackling the other side head-on.","a":["refutation"],"x":["Concession"]},{"t":"Concession","d":"Admitting that an opposing point has some merit before arguing against it.","e":"“Admittedly, uniforms can save families money; however…”","f":"Makes the writer seem fair, which makes their final point more convincing.","x":["Rebuttal"]},{"t":"Thesis","d":"The central argument of an essay, usually stated near the start.","e":"“Although Gatsby first appears to be a romantic hero, Fitzgerald presents him as a symbol of the corrupted American Dream.”","f":"Everything else in the essay should prove this.","x":["Claim"]}]},{"title":"Faulty arguments","terms":[{"t":"Fallacy","d":"A flaw in reasoning that makes an argument invalid or misleading.","e":"“Everyone’s buying it, so it must be good” sounds reasonable but doesn’t hold up.","f":"Umbrella term: name the specific fallacy and explain why the reasoning fails.","n":1,"u":1},{"t":"Ad Hominem","d":"Attacking the person making an argument instead of the argument itself.","e":"“Why listen to her views on the economy? She can’t even keep her own garden tidy.”","f":"Distracts from the issue by discrediting the speaker."},{"t":"Straw Man","d":"Misrepresenting an opponent’s argument as something weaker, then attacking that version.","e":"A: “We need more bike lanes.” B: “So you want to ban cars and force pensioners to cycle through the snow?”","f":"Makes the opposing view look ridiculous without engaging with it."},{"t":"Red Herring","d":"A distraction that pulls attention away from the real issue — an irrelevant point in an argument, or a false clue in a mystery.","e":"Asked about rising rents, the mayor launches into a speech about how much she loves the city’s parks.","f":"Dodges a difficult question — or, in fiction, keeps the reader guessing."},{"t":"Non Sequitur","d":"A conclusion or remark that does not follow from what came before.","e":"“He’s tall, so he’ll make a great manager.”","f":"Exposes faulty logic — or, in comedy, creates absurd humour."}]},{"title":"Mockery and humour","terms":[{"t":"Satire","d":"Using humour, irony or exaggeration to criticise people, institutions or society.","e":"A fake news story reports that the government has solved homelessness by officially redefining tents as houses.","f":"Makes readers laugh and then think — ask what is being criticised.","x":["Parody","Black Humor"]},{"t":"Parody","d":"An imitation of a particular work, style or person, exaggerated for comic effect.","e":"A music video copies a famous pop star’s choreography move for move — but the song is about doing the laundry.","f":"Mocks its original by exaggerating its most recognisable features.","x":["Satire"]},{"t":"Caricature","d":"A portrayal that exaggerates someone’s most recognisable features for comic or critical effect.","e":"A cartoon of a politician with an enormous chin and a tiny body.","f":"Reduces a person to a few traits, shaping how the audience sees them."},{"t":"Pun","d":"A joke that plays on a word with two meanings, or on words that sound alike.","e":"“The bicycle couldn’t stand up by itself — it was two tired.”","f":"Adds wit; in serious writing a pun can carry a double meaning that matters."},{"t":"Black Humor","d":"Comedy that finds humour in dark, disturbing subjects such as death or disaster.","e":"At the funeral, the widow murmured, “Well, at least he’s finally stopped snoring.”","f":"Helps characters and readers cope with horror — or makes the horror more unsettling.","a":["dark humour"]}]},{"title":"Kinds of language","terms":[{"t":"Colloquialism","d":"Informal, everyday language used in conversation.","e":"“Gonna grab a bite — wanna come?”","f":"Makes writing sound natural, friendly or authentic to a character."},{"t":"Dialect","d":"The distinctive vocabulary, grammar and pronunciation of a particular region or group.","e":"“Ah dinnae ken whit ye mean,” said the old fisherman.","f":"Signals identity, place and class — and how characters are perceived."},{"t":"Archaism","d":"Old-fashioned language that is no longer in everyday use.","e":"“Hark! Whither goest thou, fair maiden?”","f":"Evokes the past, solemnity or grandeur — or pokes fun at them."},{"t":"Neologism","d":"A newly invented word or expression.","e":"Words such as “doomscrolling” and “staycation” have only recently entered dictionaries.","f":"Shows a culture changing; writers coin words to name new experiences."},{"t":"Idiom","d":"A fixed expression whose meaning can’t be worked out from its individual words.","e":"“Don’t worry — the test will be a piece of cake.”","f":"Gives speech a natural, culture-specific feel."}]},{"title":"Speech and advert tricks","terms":[{"t":"Anecdote","d":"A short personal story used to illustrate a point.","e":"The speech opens: “When I was nine, I lost my dog in a snowstorm…” before turning to animal shelters.","f":"Makes an argument human and relatable.","x":["Hook"]},{"t":"Hook","d":"An opening designed to grab the reader’s attention.","e":"First line of an article: “Every forty seconds, someone in this country has a stroke.”","f":"The first line decides whether the reader keeps going.","x":["Anecdote"]},{"t":"Imperative Sentence","d":"A sentence that gives a command or instruction.","e":"“Act now. Call today. Don’t miss out.”","f":"Direct and urgent — it tells the audience exactly what to do."},{"t":"Superlative","d":"The form of an adjective or adverb that shows the highest degree: best, fastest, most.","e":"“The juiciest, cheapest, most delicious burger in town.”","f":"Makes the bold, unprovable claims typical of advertising.","x":["Comparatives"]},{"t":"Comparatives","d":"Forms of adjectives or adverbs that compare: bigger, faster, more.","e":"“Brighter whites. Softer towels. A fresher smell.”","f":"Implies superiority — though “better than what?” is often left unsaid.","x":["Superlative"]}]},{"title":"Drama devices","terms":[{"t":"Comic Relief","d":"A humorous scene or character that eases tension in a serious work.","e":"Straight after a king is murdered, a drunken porter staggers on stage joking that he guards the gate of hell.","f":"The contrast can make the surrounding tragedy feel even darker."},{"t":"Deus Ex Machina","d":"An unexpected, improbable event that suddenly solves a hopeless situation.","e":"Surrounded and doomed, the heroes are rescued when giant eagles swoop in out of nowhere.","f":"Often criticised as a cheat — but can be used deliberately to make a point about fate or luck."},{"t":"Catastrophe","d":"The final, disastrous outcome of a tragedy.","e":"The last scene of Hamlet: almost the entire royal family lies dead on the stage.","f":"Where the consequences of the hero’s choices land in full."},{"t":"Prologue","d":"An introductory section that comes before the main story.","e":"Before Act 1, a Chorus tells the audience that two “star-cross’d lovers” will die.","f":"Sets the frame, mood or expectations for everything that follows."},{"t":"Epilogue","d":"A section after the main story that concludes it or shows what happened later.","e":"A final chapter, set twenty years later, shows the survivors with their own children.","f":"Offers closure — or a last twist on how we read the ending."}]},{"title":"Downfall","terms":[{"t":"Anagnorisis","d":"The moment a character discovers a crucial truth, often about themselves.","e":"Oedipus realises that the man he killed at the crossroads was his own father.","f":"Turns ignorance into knowledge — usually too late."},{"t":"Hubris","d":"Excessive pride or self-confidence that leads to a downfall.","e":"Icarus ignores his father’s warning and flies so close to the sun that his wings melt.","f":"Classic cause of a tragic fall: defying limits that should be respected.","x":["Poetic Justice"]},{"t":"Nemesis","d":"A character’s arch-enemy, or the force that brings about their downfall.","e":"Professor Moriarty, the criminal genius who is Sherlock Holmes’s greatest enemy.","f":"Gives the protagonist an opponent who matches or mirrors them."},{"t":"Poetic Justice","d":"When good is rewarded and wrongdoing is punished — often in a fittingly ironic way.","e":"The greedy landlord who refused to fix the roof is the only one hurt when it finally collapses.","f":"Creates a satisfying sense of moral order — or exposes its absence when it’s missing.","x":["Hubris"]},{"t":"Melodrama","d":"A drama with exaggerated characters and emotions designed to appeal strongly to the audience’s feelings.","e":"A play with a moustache-twirling villain, a fainting heroine tied to train tracks and swelling music at every emotional moment.","f":"Sensational and emotional; calling a scene this is often a criticism."}]},{"title":"Poetic forms","terms":[{"t":"Sonnet","d":"A 14-line poem, usually in iambic pentameter with a set rhyme scheme.","e":"“Shall I compare thee to a summer’s day?” opens one of Shakespeare’s 154 poems in this form.","f":"Its tight structure (and its turn) shapes how the argument unfolds."},{"t":"Couplet","d":"Two consecutive lines of poetry, usually rhyming.","e":"“So long as men can breathe or eyes can see, / So long lives this, and this gives life to thee.” (Shakespeare)","f":"Often used to conclude, sum up or add a twist."},{"t":"Quatrain","d":"A stanza or poem of four lines.","e":"“The sea is calm, the sky is grey, / the gulls have flown, the boats have gone; / the tide pulls all my words away, / and still the lighthouse blinks on.”","f":"The most common stanza length in English poetry."},{"t":"Free Verse","d":"Poetry without a regular meter or rhyme scheme.","e":"Walt Whitman’s “Song of Myself” uses long, unrhymed lines that follow the rhythms of speech.","f":"Freedom from form can feel natural, conversational or rebellious."},{"t":"Blank Verse","d":"Unrhymed lines of iambic pentameter.","e":"“But, soft! what light through yonder window breaks?” — most of Shakespeare’s dialogue is written this way.","f":"Close to the rhythm of natural speech, but with dignity and structure."}]},{"title":"Meter","terms":[{"t":"Meter","d":"The regular pattern of stressed and unstressed syllables in a line of poetry.","e":"Reading a line aloud and hearing a steady “da-DUM da-DUM da-DUM” beat.","f":"Notice when the regular beat breaks — that is often where the meaning sits.","n":1},{"t":"Iamb","d":"A metrical foot of one unstressed syllable followed by a stressed one: da-DUM.","e":"“to-DAY”, “be-CAUSE”, “a-BOVE”","f":"The heartbeat rhythm closest to natural English speech."},{"t":"Trochaic","d":"Built from trochees — a stressed syllable followed by an unstressed one: DUM-da.","e":"“TY-ger, TY-ger, BURN-ing BRIGHT” (William Blake)","f":"Feels strong, chant-like and insistent."},{"t":"Anapest","d":"A metrical foot of two unstressed syllables followed by a stressed one: da-da-DUM.","e":"“’Twas the NIGHT before CHRIST-mas, and ALL through the HOUSE”","f":"Gives a galloping, lively rhythm."},{"t":"Dactyl","d":"A metrical foot of one stressed syllable followed by two unstressed: DUM-da-da.","e":"“HALF a league, HALF a league, HALF a league ON-ward” (Tennyson)","f":"Creates a falling, driving rhythm — like hooves or a march."}]},{"title":"Figurative language II","terms":[{"t":"Extended Metaphor","d":"A comparison that is developed over several lines or a whole text.","e":"“Life is a voyage: some days the sea is calm, some days storms batter the hull, and always we steer by stars we’ll never reach.”","f":"Builds a whole way of seeing the subject — track how each new detail develops it."},{"t":"Metonymy","d":"Referring to something by the name of something closely associated with it.","e":"“Downing Street refused to comment.”","f":"A compact way of linking an idea to its symbol, place or tool."},{"t":"Synecdoche","d":"Using a part to stand for the whole, or the whole for a part.","e":"“All hands on deck!”","f":"Focuses attention on one revealing part — workers as just “hands”, for example."},{"t":"Pathetic Fallacy","d":"Giving human emotions to nature or the weather, often to mirror a character’s mood.","e":"As she read the letter, the sky darkened and a sullen rain began to fall.","f":"Lets the setting express what a character feels."},{"t":"Apostrophe","d":"Directly addressing someone absent or dead, or something non-human, as if it could hear.","e":"“Death, be not proud, though some have called thee / Mighty and dreadful…” (John Donne)","f":"Expresses intense emotion and makes an abstract idea feel present."}]},{"title":"Figurative language III","terms":[{"t":"Conceit","d":"An elaborate, surprising comparison between two very different things, often extended.","e":"John Donne compares two parted lovers to the legs of a drawing compass: one fixed, one roaming, always joined.","f":"Shows off the writer’s ingenuity and makes us see something familiar in a startling way.","x":["Analogy"]},{"t":"Implied Metaphor","d":"A metaphor that suggests the comparison without stating it directly.","e":"“Her anger simmered all afternoon and finally boiled over at dinner.”","f":"The comparison works quietly through verbs and adjectives."},{"t":"Analogy","d":"An extended comparison that explains something unfamiliar through something familiar.","e":"A firewall works like a bouncer at a club door, checking every guest against the list.","f":"Makes a complex idea easy to grasp — common in persuasive and explanatory writing.","x":["Conceit"]},{"t":"Anthropomorphism","d":"Giving animals or objects fully human form and behaviour, so they act like people.","e":"In the story, the rabbits wear waistcoats, hold council meetings and argue about taxes.","f":"Lets writers explore human behaviour at one remove, especially in fables and children’s fiction."},{"t":"Zoomorphism","d":"Giving animal characteristics to humans, gods or objects.","e":"He wolfed down his dinner, growling at anyone who came near his plate.","f":"Often suggests something primitive, threatening or comic about a person.","x":["Implied Metaphor"]}]},{"title":"Plot versus story","terms":[{"t":"Plot","d":"The events of a narrative arranged so that they are linked by cause and effect.","e":"“The fire alarm rang, so the students fled — and in the chaos, someone stole the exam papers.”","f":"Ask why events are arranged in this order and what causes what."},{"t":"Story","d":"The events of a narrative in the order they happened, before the writer shapes them.","e":"“The fire alarm rang. Then the students left. Then the exam papers were missing.”","f":"Comparing the raw sequence with how it is told shows the writer’s choices."},{"t":"Conflict","d":"The struggle between opposing forces that drives a story.","e":"A girl dreams of becoming a pilot; her father insists she take over the family shop.","f":"Without it there is no story — identify who or what is in opposition."},{"t":"Subplot","d":"A secondary storyline running alongside the main plot.","e":"While the detective hunts the killer, a second storyline follows her rocky relationship with her teenage son.","f":"Often mirrors or contrasts with the main plot’s themes."},{"t":"Turning Point","d":"The moment when the direction of a story changes decisively.","e":"When the hero finds the letter proving his father’s innocence, everything changes direction.","f":"Marks a shift in the character’s fortunes or understanding."}]},{"title":"Hidden meanings","terms":[{"t":"Ambiguity","d":"When a word, phrase or situation can be understood in more than one way.","e":"“I saw the man with the telescope.” (Who had the telescope?)","f":"Can be a mistake — or a deliberate way to hold two meanings open."},{"t":"Double Entendre","d":"A phrase with two meanings, one of which is usually cheeky or risqué.","e":"A bakery sign: “Come in and squeeze our buns.”","f":"Lets a writer slip in a second, naughtier meaning with deniability.","x":["Ambiguity","Innuendo"]},{"t":"Innuendo","d":"An indirect hint, usually suggesting something negative or improper.","e":"“Well, he certainly got promoted quickly,” she said, raising an eyebrow.","f":"Damages a reputation without making a direct accusation.","x":["Double Entendre","Subtext"]},{"t":"Subtext","d":"The unspoken meaning beneath what characters actually say.","e":"A couple argue about who left the lights on — but the scene is really about their failing marriage.","f":"Much of drama’s tension lives here: read what is not being said.","x":["Undertone"]},{"t":"Undertone","d":"A subtle feeling or quality running beneath the surface of a text.","e":"The cheerful holiday postcard has a faint sadness: “Wish you were here — the house is so quiet now.”","f":"Adds complexity: a text can feel one way on top and another underneath.","x":["Subtext"]}]},{"title":"Setting and voice","terms":[{"t":"Setting","d":"The time and place in which a story happens.","e":"Victorian London, 1888: foggy streets, gas lamps, horse-drawn cabs.","f":"Shapes characters’ choices and often reflects the themes.","x":["Atmosphere"]},{"t":"Atmosphere","d":"The overall feeling of a place or scene, created through description.","e":"Fog curls round the gravestones, a crow calls, and the church bell tolls midnight.","f":"Immerses the reader and prepares them emotionally for what comes next.","x":["Setting"]},{"t":"Persona","d":"A character or “mask” a writer adopts in order to speak through.","e":"Jonathan Swift writes “A Modest Proposal” as a calm, reasonable economist who suggests eating babies.","f":"The gap between writer and persona is often where the satire or irony lies."},{"t":"Voice","d":"The distinctive personality and style that comes through a writer’s or narrator’s words.","e":"A narrator who calls everyone “phony”, swears constantly and keeps saying “it killed me” is instantly recognisable.","f":"Describe a voice with precise adjectives and show which features create it.","n":1},{"t":"Style","d":"The overall way a writer writes — diction, sentence structure, tone and imagery combined.","e":"Hemingway’s short, plain sentences versus Dickens’s long, ornate ones.","f":"Comparing styles is central to comparative essays.","n":1}]},{"title":"Endings and twists","terms":[{"t":"Falling Action","d":"The events after the climax that lead towards the ending.","e":"After the duel, the story winds down: the wounded are tended, secrets come out, loose ends begin to tie up.","f":"Shows the consequences of the climax.","x":["Denouement"]},{"t":"Denouement","d":"The final outcome, where everything is explained and resolved.","e":"The last chapter: weddings, reunions and every remaining mystery explained.","f":"Ask whether the ending feels earned, neat, open or unsettling.","x":["Falling Action"]},{"t":"Suspense","d":"The tension and anticipation a reader feels about what will happen next.","e":"Footsteps creak up the stairs, one by one, as she hides under the bed holding her breath.","f":"Keeps the reader turning pages — often built by delay and short sentences."},{"t":"Plot Twist","d":"An unexpected development that changes the direction of a story.","e":"In the last chapter, we discover that the kind, helpful narrator was the murderer all along.","f":"Forces the reader to reinterpret everything that came before."},{"t":"Frame Story","d":"A story that contains another story, or several, within it.","e":"Pilgrims on the road to Canterbury take turns telling tales, and each tale is a story of its own.","f":"The outer story shapes how we read the inner ones."}]},{"title":"Rhyme","terms":[{"t":"Rhyme","d":"The repetition of matching sounds at the ends of words.","e":"“moon” and “June”, “fire” and “desire”","f":"Umbrella term: name the kind of rhyme and say what it links or emphasises.","n":1,"u":1},{"t":"Rhyme Scheme","d":"The pattern of rhymes at the ends of lines, labelled with letters.","e":"Lines 1 and 3 rhyme with each other, and lines 2 and 4 rhyme with each other: ABAB.","f":"A regular pattern creates order; a broken one draws attention."},{"t":"Internal Rhyme","d":"A rhyme within a single line of poetry.","e":"“Once upon a midnight dreary, while I pondered, weak and weary” (Edgar Allan Poe)","f":"Adds music and speed, binding words inside the line."},{"t":"Half Rhyme","d":"Words that almost rhyme, with similar but not identical sounds.","e":"“worm” and “swarm”, “bridge” and “grudge”","f":"Feels unresolved or uneasy — useful for conflict, doubt or war poetry.","a":["slant rhyme","near rhyme"]},{"t":"Euphony","d":"Pleasant, smooth, musical sounds in a line.","e":"“Season of mists and mellow fruitfulness” (John Keats)","f":"Soothes the reader and suits peaceful or beautiful subjects."}]},{"title":"Heroes and doubles","terms":[{"t":"Hero","d":"A central character admired for courage, strength or virtue.","e":"A knight risks his life to save a village from a dragon.","f":"Embodies the values a story celebrates."},{"t":"Anti-Hero","d":"A main character who lacks traditional heroic qualities such as courage or morality.","e":"A lazy, selfish thief ends up saving the city — mostly by accident and only for the reward.","f":"Makes readers question what heroism really is."},{"t":"Deuteragonist","d":"The second most important character, often the protagonist’s companion or rival.","e":"Dr Watson, always at Sherlock Holmes’s side.","f":"Often our way into understanding the protagonist."},{"t":"Doppelganger","d":"A character’s double or look-alike, often sinister.","e":"A man keeps meeting a stranger with his exact face, name and birthday, who slowly takes over his life.","f":"Explores divided identity — the self we hide or fear."},{"t":"Motivation","d":"The reason behind a character’s actions.","e":"She lies to the police because she is protecting her younger brother.","f":"Understanding why characters act is key to judging them."}]},{"title":"Rhetorical schemes","terms":[{"t":"Accumulation","d":"Piling up words or phrases that build on one another to emphasise a point.","e":"“He was a liar, a cheat, a coward, a thief — a disgrace to everything this school stands for.”","f":"Overwhelms the audience with the weight of evidence or emotion."},{"t":"Polyptoton","d":"Repeating a word in different grammatical forms.","e":"“Love is not love / Which alters when it alteration finds” (Shakespeare)","f":"Plays variations on one idea, turning it over and over."},{"t":"Isocolon","d":"Two or more phrases of exactly equal length and structure.","e":"“Easy to say, hard to do.”","f":"The perfect balance makes a line punchy and memorable."},{"t":"Hyperbaton","d":"Rearranging the normal word order for emphasis.","e":"“Sweet was the silence after the storm.”","f":"Throws weight onto the word moved out of place."},{"t":"Aposiopesis","d":"Breaking off suddenly in the middle of a sentence.","e":"“Get out now, or I’ll—” He didn’t finish.","f":"Suggests overwhelming emotion, a threat, or something too terrible to say."}]},{"title":"Time and pacing","terms":[{"t":"Chronology","d":"Telling events in the order in which they happened.","e":"The novel follows its hero strictly in time order, from his birth in 1901 to his death in 1980.","f":"Notice when a writer breaks the timeline — and why."},{"t":"Pacing","d":"The speed at which a story moves.","e":"A single afternoon of battle takes forty pages, while the next ten years pass in one paragraph.","f":"Slowing down signals importance; speeding up creates momentum."},{"t":"Digression","d":"A temporary departure from the main subject or storyline.","e":"In the middle of the chase, the narrator stops for three pages to discuss the history of the city’s sewers.","f":"Can build suspense, add humour or reveal the narrator’s personality."},{"t":"Vignette","d":"A short, detailed sketch of a moment, character or place, with little or no plot.","e":"A brief, richly described scene of a grandmother shelling peas on her porch at dusk.","f":"Captures a mood or impression rather than telling a story."},{"t":"Montage","d":"A sequence of quick scenes or images that compresses time or builds an idea.","e":"Training at dawn, sparring, falling, rising — months of preparation shown in two minutes.","f":"Common in film and in fragmented modern writing."}]},{"title":"Wordplay and wit","terms":[{"t":"Zeugma","d":"Using one word to apply to two others in different senses.","e":"“She lost her keys and her temper.”","f":"Creates a witty jolt as the second meaning lands."},{"t":"Malapropism","d":"Mistakenly using a similar-sounding word with a completely different meaning, often comically.","e":"“He’s the very pineapple of politeness!” (meaning “pinnacle”)","f":"Mocks characters who try to sound cleverer than they are."},{"t":"Antanaclasis","d":"Repeating a word with a different meaning each time.","e":"“We must all hang together, or we shall all hang separately.”","f":"Makes a sharp, witty point by twisting a word’s meaning."},{"t":"Bathos","d":"A sudden drop from the serious or grand to the trivial or ridiculous.","e":"The battle raged, heroes fell, the sky burned red — and then Gerald realised he’d forgotten his sandwiches.","f":"Used deliberately for comedy; unintentional versions just fall flat."},{"t":"Wit","d":"Quick, clever humour that shows intelligence.","e":"“I’m not arguing — I’m simply explaining why I’m right.”","f":"Shows a character’s or writer’s sharpness; often carries criticism lightly.","n":1,"u":1}]},{"title":"Poetic forms II","terms":[{"t":"Ode","d":"A lyric poem that addresses and praises a person, object or idea in elevated language.","e":"Keats addresses a Grecian urn in rich, admiring stanzas, praising its timeless beauty.","f":"Its seriousness can be heartfelt — or used ironically for something trivial."},{"t":"Elegy","d":"A poem of mourning for someone who has died.","e":"Tennyson’s In Memoriam, a long poem grieving the death of his close friend Arthur Hallam.","f":"Often moves from grief towards consolation."},{"t":"Ballad","d":"A song-like poem that tells a story, usually in four-line stanzas, often with a repeated line.","e":"A sung poem in short, rhyming stanzas about a sailor lost at sea, passed down from singer to singer.","f":"Simple, musical and dramatic — rooted in oral tradition."},{"t":"Lyric Poem","d":"A short poem expressing personal thoughts and feelings.","e":"A short poem in which the speaker describes her joy on a spring morning.","f":"The most common kind of poem: focus on the speaker’s emotions.","a":["lyric"]},{"t":"Epic","d":"A long narrative poem about heroic deeds, often involving gods and the fate of a nation.","e":"Homer’s Odyssey follows a hero’s ten-year journey home past monsters, gods and storms.","f":"Sets out a culture’s values on a grand scale."}]},{"title":"Sentence craft","terms":[{"t":"Ellipsis","d":"Leaving words out of a sentence — or the “…” mark that shows something has been omitted or trails off.","e":"“Well… I suppose… if you really want to.”","f":"Suggests hesitation, unspoken thoughts or something left for the reader to fill in."},{"t":"Parenthesis","d":"A word, phrase or clause inserted into a sentence as an aside, set off by brackets, dashes or commas.","e":"“My brother — who has never once cooked dinner — gave me advice on my recipe.”","f":"Lets the writer add a comment, often revealing tone or humour."},{"t":"Hypotaxis","d":"Building sentences with many subordinate clauses that show how ideas relate.","e":"“Because the train was late, and since she had no phone, she waited, although she was afraid, until the station closed.”","f":"Suggests careful reasoning or complex thought."},{"t":"Parataxis","d":"Placing short, simple clauses side by side without showing how they relate.","e":"“The rain fell. The streets emptied. She walked home alone.”","f":"Creates a plain, stark or breathless effect, leaving the reader to make connections."},{"t":"Inversion","d":"Reversing the usual order of words in a sentence.","e":"“Into the dark forest rode the knight.”","f":"Builds suspense or emphasis by delaying the subject."}]},{"title":"Story moments","terms":[{"t":"Epiphany","d":"A sudden moment of insight or realisation for a character.","e":"Staring at her reflection, Lily suddenly understands she has spent her whole life trying to please her mother.","f":"Often the emotional core of a short story."},{"t":"Self-Fulfilling Prophecy","d":"A prediction that causes itself to come true.","e":"Warned that his son will kill him, a king abandons the baby — setting up the very events that lead to his death.","f":"Explores fate versus free will."},{"t":"External Conflict","d":"A struggle between a character and an outside force — another person, nature or society.","e":"Stranded on the ice, the explorers battle blizzards, hunger and a polar bear.","f":"Contrast it with internal conflict, the struggle inside a character’s mind."},{"t":"Anachronism","d":"Something placed in a time period where it doesn’t belong.","e":"In a film set in ancient Rome, a soldier can be seen wearing a wristwatch.","f":"Can be an error — or a deliberate way to link past and present."},{"t":"Verisimilitude","d":"The quality of seeming true or real.","e":"Real street names, historical events and accurate slang make the novel’s invented characters feel completely real.","f":"Makes readers believe in a fictional world."}]},{"title":"Meter II","terms":[{"t":"Iambic Pentameter","d":"A line of ten syllables in five da-DUM beats (five iambs).","e":"“Shall I compare thee to a summer’s day?”","f":"The standard line of English poetry and drama; changes to the pattern signal emphasis or disturbance.","a":["pentameter"]},{"t":"Spondee","d":"A metrical foot of two stressed syllables: DUM-DUM.","e":"“Break, break, break, / On thy cold grey stones, O Sea!” (Tennyson)","f":"Slows a line down and adds heavy, deliberate weight."},{"t":"Foot","d":"The basic unit of meter: a small group of stressed and unstressed syllables.","e":"In “to-DAY · the SUN · is OUT”, each da-DUM unit counts as one.","f":"Counting these tells you the line length (trimeter, pentameter and so on)."},{"t":"Scansion","d":"Marking the stressed and unstressed syllables of a line to work out its meter.","e":"Writing ˘ / · ˘ / · ˘ / above a line to map out its beats.","f":"The practical skill behind any comment on rhythm."},{"t":"Rhythm","d":"The pattern of beats and stresses in language, in poetry or prose.","e":"A line can feel galloping, plodding, broken or smooth.","f":"Umbrella term: describe the rhythm and link it to meaning.","n":1,"u":1}]},{"title":"Texts talking to texts","terms":[{"t":"Intertextuality","d":"The way one text refers to, borrows from or responds to another.","e":"A modern novel retells Jane Eyre from the point of view of Mr Rochester’s first wife.","f":"Reading the two texts together creates new meaning.","x":["Homage","Pastiche"]},{"t":"Context","d":"The historical, social and cultural circumstances in which a text is written or read.","e":"To understand Things Fall Apart fully, readers learn about British colonial rule in Nigeria in the late 1800s.","f":"Explains why a text says what it says — and why readers respond differently over time."},{"t":"Homage","d":"A respectful tribute to another artist or work within a new work.","e":"A director recreates a famous scene from an old horror film shot for shot as a tribute in his own movie.","f":"Signals admiration and places the new work in a tradition.","x":["Pastiche","Intertextuality"]},{"t":"Pastiche","d":"A work that imitates the style of another writer or period, usually as a celebration rather than mockery.","e":"A new Sherlock Holmes mystery written entirely in the style of Arthur Conan Doyle.","f":"Unlike parody, it imitates without ridiculing.","x":["Homage","Intertextuality"]},{"t":"Perspective","d":"The angle or point of view from which something is seen or presented.","e":"The same car crash told twice: once by the driver, once by the pedestrian.","f":"Shapes our sympathies — ask whose view is missing."}]},{"title":"Sound III","terms":[{"t":"Cacophony","d":"Harsh, jarring, unpleasant combinations of sounds.","e":"“The crunching, cracking, clanking jaws of the machine.”","f":"Suits violence, chaos or ugliness."},{"t":"Cadence","d":"The rhythmic rise and fall of a voice or a sentence.","e":"The preacher’s voice rose and fell in a slow, rolling rhythm that carried the whole congregation.","f":"Gives speeches and prose a musical, persuasive flow."},{"t":"Refrain","d":"A line or phrase repeated at intervals, especially at the end of stanzas.","e":"Each stanza of the ballad ends with the same line: “And the river ran on.”","f":"Creates a chorus-like structure; its meaning often deepens with each return."},{"t":"End Rhyme","d":"Rhyme on the final words of lines.","e":"“The night was still and very deep, / And all the town had gone to sleep.”","f":"Creates closure and musical structure."},{"t":"Eye Rhyme","d":"Words that look as if they should rhyme but sound different.","e":"“love” and “move”, “cough” and “bough”","f":"Creates a visual link with a slight jolt for the ear."}]},{"title":"Active, passive, balanced","terms":[{"t":"Active Voice","d":"A sentence structure in which the subject performs the action.","e":"“The dog bit the postman.”","f":"Direct and clear: it shows exactly who did what."},{"t":"Passive Voice","d":"A sentence structure in which the subject receives the action, so the doer may be hidden.","e":"“Mistakes were made.”","f":"Can hide who is responsible — a favourite of politicians and corporations."},{"t":"Balanced Sentence","d":"A sentence made of two halves of similar length and structure.","e":"“The young dream of the future; the old dream of the past.”","f":"Creates a sense of order and invites comparison of the two halves."},{"t":"Anti-Climax","d":"A disappointing let-down after a build-up of expectation.","e":"After two hours of drumrolls and fireworks, the “surprise guest” turned out to be the drummer’s uncle.","f":"Can be deliberate (comic, ironic) or a structural weakness."},{"t":"Amplification","d":"Repeating a word or idea and adding detail to expand and emphasise it.","e":"“She was beautiful — beautiful in a way that stopped conversations, beautiful in a way that made strangers turn.”","f":"Makes the reader linger on an idea and feel its importance."}]},{"title":"Clever arguing","terms":[{"t":"Paralipsis","d":"Drawing attention to something by claiming you won’t mention it.","e":"“I won’t even mention my opponent’s three failed businesses.”","f":"A sly way of making an attack while appearing above it."},{"t":"Procatalepsis","d":"Anticipating an objection and answering it before the opponent can raise it.","e":"“Some will say this plan is too expensive. But consider what doing nothing will cost us.”","f":"Takes the wind out of the other side’s argument."},{"t":"Aporia","d":"Expressing real or pretended doubt or uncertainty about what to say or do.","e":"“What am I to do? Should I stay, or should I go? I truly don’t know.”","f":"Shows inner conflict — or invites the audience to work through a problem."},{"t":"Hypothetical Question","d":"A question about an imagined situation, often beginning “What if…” or “If you could…”.","e":"“If you could live forever, would you?”","f":"Invites the audience to imagine and reflect."},{"t":"Rhetorical Device","d":"Any technique a speaker or writer uses to persuade or affect an audience.","e":"Rhetorical questions, tricolon, anaphora and appeals to emotion are all examples.","f":"Umbrella term: name the specific device and explain its effect on the audience.","n":1,"u":1}]},{"title":"Word choice II","terms":[{"t":"Cliché","d":"An overused phrase or idea that has lost its impact.","e":"“At the end of the day, we gave it 110 percent.”","f":"Signals lazy writing — or characterises a speaker who relies on stock phrases."},{"t":"Pejorative","d":"A word that expresses contempt or disapproval.","e":"Calling a politician’s supporters “sheep”.","f":"Reveals the writer’s attitude and pushes the reader to share it."},{"t":"Slang","d":"Very informal words, often specific
