to a group or generation, that change quickly.","e":"“That party was lit — no cap.”","f":"Signals identity and belonging; dates quickly."},{"t":"Portmanteau","d":"A word formed by blending two words.","e":"“brunch” (breakfast + lunch), “smog” (smoke + fog)","f":"Shows language evolving to name new things."},{"t":"Epithet","d":"A descriptive word or phrase attached to a name.","e":"“Alexander the Great”, “rosy-fingered Dawn”","f":"Captures a defining quality in a few words."}]},{"title":"Genres I","terms":[{"t":"Dystopia","d":"An imagined society that is frightening or oppressive, often a warning about the present.","e":"A future state where the government watches every citizen through screens and rewrites history daily.","f":"Exaggerates present-day dangers to warn readers.","x":["Science Fiction"]},{"t":"Utopia","d":"An imagined perfect society.","e":"An island where there is no money, crime or poverty, and everyone shares the work equally.","f":"Explores ideals — and often hints at their impossibility."},{"t":"Bildungsroman","d":"A novel about a character’s growth from youth to maturity.","e":"Jane Eyre follows Jane from mistreated orphan to an independent adult who knows her own mind.","f":"Focuses on identity, education and finding one’s place in the world."},{"t":"Epistolary","d":"Written in the form of letters, diary entries or other documents.","e":"Frankenstein is told through letters an explorer writes to his sister.","f":"Creates intimacy and immediacy — but each writer is a limited, possibly unreliable, narrator."},{"t":"Science Fiction","d":"Fiction based on imagined scientific or technological developments, often in the future or in space.","e":"A crew travels through a wormhole and lands on a planet where time runs slower.","f":"Uses “what if?” to explore human questions.","x":["Dystopia"]}]},{"title":"Senses and stretched language","terms":[{"t":"Synesthesia","d":"Describing one sense in terms of another.","e":"“a loud yellow shirt”, “her voice tasted of honey”","f":"Creates surprising, vivid descriptions that blur the senses."},{"t":"Kinesthetic Imagery","d":"Description of movement, physical effort or bodily sensation.","e":"“Her legs burned as she drove up the final hill, lungs heaving, arms pumping.”","f":"Puts the reader inside the character’s body.","a":["kinesthesia"]},{"t":"Adynaton","d":"Exaggeration so extreme that it describes something impossible.","e":"“I’ll forgive him when the sea runs dry.”","f":"Stresses the impossibility of something happening."},{"t":"Catachresis","d":"A strained, mixed or misapplied figure of speech.","e":"“We need to grasp the nettle before the ship sails and the bubble bursts.”","f":"Usually a mistake; sometimes used deliberately for shock or comedy."},{"t":"Figurative Language","d":"Language that departs from literal meaning to create an effect.","e":"Metaphor, simile, personification and hyperbole are all examples.","f":"Umbrella term: always name the specific device.","n":1,"u":1}]},{"title":"Poetic forms III","terms":[{"t":"Villanelle","d":"A 19-line poem with two lines that repeat throughout, built on just two rhymes.","e":"Dylan Thomas’s “Do not go gentle into that good night” keeps circling back to the same two lines.","f":"The obsessive repetition suits grief, fixation or insistence.","x":["Tercet"]},{"t":"Haiku","d":"A three-line Japanese form of 5, 7 and 5 syllables, often capturing a moment in nature.","e":"“Cold morning puddle — / a single red leaf drifting, / the sky inside it.”","f":"Distils a single image or moment.","x":["Tercet"]},{"t":"Limerick","d":"A humorous five-line poem with an AABBA rhyme scheme.","e":"“A student who studied all night / Found her flashcards a source of delight; / She learned five a day / In a curious way, / And by May she got every one right.”","f":"Bouncy rhythm and rhyme make it comic."},{"t":"Sestina","d":"A complex poem of six six-line stanzas and a three-line ending, using the same six end-words in rotating order.","e":"A poem whose lines keep ending on the same six words — “river”, “stone”, “light”, “hand”, “door”, “winter” — in a shifting pattern.","f":"The returning words suit obsession or circling thoughts."},{"t":"Tercet","d":"A stanza or group of three lines.","e":"“The tide goes out. / The gulls go quiet. / The harbour holds its breath.”","f":"Its odd number can feel unbalanced or moving forward.","x":["Haiku"]}]},{"title":"Logic","terms":[{"t":"Premise","d":"A statement an argument is built on, from which a conclusion is drawn.","e":"In “All humans are mortal; Socrates is human; so Socrates is mortal”, the first two statements.","f":"If a premise is false, the conclusion collapses.","x":["Syllogism","Deductive Reasoning"]},{"t":"Syllogism","d":"A three-part argument: two premises lead to a conclusion.","e":"“All birds have feathers. A penguin is a bird. Therefore a penguin has feathers.”","f":"Looks watertight — so check whether the premises are actually true.","x":["Deductive Reasoning","Premise"]},{"t":"Deductive Reasoning","d":"Reasoning from general principles to a specific, certain conclusion.","e":"“Only someone with a key could open the safe. Only the manager has a key. So the manager opened it.”","f":"If the premises are true, the conclusion must be.","x":["Syllogism","Premise"]},{"t":"Induction","d":"Reasoning from specific examples to a general conclusion that is probable, not certain.","e":"“Every swan I have ever seen is white, so all swans must be white.”","f":"Useful but risky: one counter-example can break it.","x":["Inference"]},{"t":"Inference","d":"A conclusion reached from evidence and reasoning rather than stated directly.","e":"Her umbrella is dripping and her shoes are soaked, so it must be raining outside.","f":"Close reading is all about drawing these from textual clues.","x":["Induction","Deductive Reasoning"]}]},{"title":"Persuasion and purpose","terms":[{"t":"Persuasion","d":"Using language to convince an audience to believe or do something.","e":"A campaign, a speech, an advert or an op-ed all set out to change minds.","f":"Umbrella term: identify the techniques and the purpose.","n":1,"u":1},{"t":"Rhetoric","d":"The art of effective or persuasive speaking and writing.","e":"Studying how a speech uses structure, appeals and devices to move its audience.","f":"Umbrella term; “just rhetoric” is also used to mean empty words.","n":1,"u":1},{"t":"Polemic","d":"A strong, often aggressive written attack on an idea, person or institution.","e":"An essay titled “Why Zoos Must Be Abolished”, attacking zookeepers point by point.","f":"One-sided by design — look for what it ignores."},{"t":"Eulogy","d":"A speech or piece of writing praising someone, usually someone who has recently died.","e":"At the funeral, her brother speaks about her kindness, her terrible jokes and the way she lit up every room.","f":"Shapes how a person is remembered."},{"t":"Didacticism","d":"Writing designed to teach a lesson or moral.","e":"A children’s story in which every chapter ends with an explicit lesson about honesty.","f":"Can feel preachy — ask whether the lesson is shown or simply stated."}]},{"title":"Comic forms","terms":[{"t":"Farce","d":"A comedy built on absurd situations, chaos, slapstick and improbable coincidences.","e":"Three lovers hide in the same wardrobe, a husband falls out of a window, and everyone ends up in the wrong trousers.","f":"Pure, physical comedy at a fast pace."},{"t":"Lampoon","d":"A harsh piece of satire that ridicules a specific person.","e":"A newspaper column mercilessly mocks the mayor as a bumbling clown who can’t find his own office.","f":"Aims to damage the target’s reputation through laughter.","x":["Burlesque"]},{"t":"Burlesque","d":"A mocking imitation that treats a serious subject trivially or a trivial subject seriously.","e":"Alexander Pope’s The Rape of the Lock treats the theft of a lock of hair as if it were an epic battle.","f":"The mismatch between style and subject creates the comedy.","x":["Lampoon","Farce"]},{"t":"Comedy","d":"A light, humorous drama or story, usually with a happy ending.","e":"A Midsummer Night’s Dream: confused lovers, mischief in the woods, and three weddings at the end.","f":"Restores order through marriage or reconciliation."},{"t":"Tragicomedy","d":"A work that blends tragic and comic elements.","e":"Two tramps tell jokes and do slapstick routines while waiting for someone who never comes.","f":"Laughter and pain sit side by side, unsettling the audience.","x":["Comedy","Farce"]}]},{"title":"Literary movements","terms":[{"t":"Romanticism","d":"A late-18th and 19th-century movement celebrating emotion, nature, imagination and the individual.","e":"Wordsworth wanders among daffodils, finding joy and spiritual meaning in nature.","f":"A reaction against reason, industry and city life."},{"t":"Realism","d":"A 19th-century movement depicting ordinary life accurately, without idealising it.","e":"A novel carefully portraying middle-class money worries and unhappy marriages exactly as they are.","f":"Focuses on everyday people and believable detail.","x":["Naturalism"]},{"t":"Naturalism","d":"An extreme form of realism showing characters shaped by heredity, environment and forces beyond their control.","e":"A family is destroyed by poverty, alcohol and inherited violence, as if they had no free will at all.","f":"Bleak and deterministic — people as products of their circumstances.","x":["Realism"]},{"t":"Surrealism","d":"A movement using dreamlike, irrational and bizarre images to explore the unconscious mind.","e":"Clocks melt, a fish walks into a lawyer’s office, and nobody finds it strange.","f":"Unsettles our sense of logic and reality."},{"t":"Existentialism","d":"A philosophy holding that life has no built-in meaning, so individuals must create their own through their choices.","e":"A character decides that nothing in the universe gives his life purpose, so he must choose one himself.","f":"Central to much 20th-century fiction and drama."}]},{"title":"Parts of a poem","terms":[{"t":"Line Break","d":"The point where one line of poetry ends and the next begins.","e":"A poet ends a line on “falling” — “and then the tower started falling / down” — so the reader’s eye drops too.","f":"The white space at the end of a line is a choice: ask what it emphasises."},{"t":"Octave","d":"An eight-line stanza, especially the first eight lines of a Petrarchan sonnet.","e":"The opening eight lines of an Italian-style sonnet, which set out the problem.","f":"Usually followed by a turn."},{"t":"Sestet","d":"A six-line stanza, especially the last six lines of a Petrarchan sonnet.","e":"The final six lines of an Italian-style sonnet, which answer the problem.","f":"Often where the poem resolves or shifts."},{"t":"Canto","d":"A major section of a long poem.","e":"Dante’s Inferno is divided into thirty-four of these.","f":"The long-poem equivalent of a chapter."},{"t":"Verse","d":"Writing arranged in lines with rhythm — poetry rather than prose; also a single line or stanza.","e":"Shakespeare’s nobles often speak in lines of poetry while his servants speak in prose.","f":"A switch between verse and prose can reveal class, mood or madness.","n":1,"u":1}]},{"title":"Logic II","terms":[{"t":"Enthymeme","d":"An argument with an unstated premise that the audience is expected to fill in.","e":"“He’s a politician, so of course he’s lying.” (Unstated: all politicians lie.)","f":"Persuasive because the audience supplies the missing step themselves."},{"t":"Reductio ad Absurdum","d":"Disproving an idea by showing that it leads to absurd consequences.","e":"“If we let students choose their own homework, why not let them choose their own grades and run the school?”","f":"Exposes the weakness of a position by pushing it to an extreme."},{"t":"Equivocation","d":"Using a word with two meanings to mislead or confuse.","e":"“A feather is light. What is light cannot be dark. Therefore a feather cannot be dark.”","f":"A slippery way of making a false argument sound valid."},{"t":"Dichotomy","d":"A division into two sharply contrasting, often opposing, parts.","e":"The novel divides its world into the rich hill-dwellers and the poor river people, with nothing in between.","f":"Writers often set up a split like this and then complicate it."},{"t":"Dilemma","d":"A situation in which a character must choose between two difficult options.","e":"A soldier must either obey an unjust order or desert and leave his comrades behind.","f":"Reveals character through choice."}]},{"title":"Names and substitutes","terms":[{"t":"Periphrasis","d":"Using a longer, roundabout phrase instead of a short, direct one.","e":"Calling the sun “the bright orb of day”.","f":"Can sound elevated, poetic, evasive or pompous.","x":["Kenning"]},{"t":"Antonomasia","d":"Replacing a name with a title or epithet — or using a famous name for a type of person.","e":"Calling Shakespeare simply “the Bard”.","f":"Packs reputation into a nickname."},{"t":"Kenning","d":"A compound metaphor used in place of a noun, typical of Old English and Norse poetry.","e":"“whale-road” for the sea, “bone-house” for the body","f":"Makes the familiar strange and vivid.","x":["Periphrasis"]},{"t":"Metalepsis","d":"A figure of speech that refers to something through a chain of associations.","e":"“She’s got a lead foot” — meaning she drives too fast (heavy foot, pedal pressed down, speeding).","f":"The reader has to make several leaps to reach the meaning."},{"t":"Eponym","d":"A person after whom something is named, or the name itself.","e":"The sandwich is named after the Earl of Sandwich; “Machiavellian” comes from Niccolò Machiavelli.","f":"Shows how people become words."}]},{"title":"Tone and attitude II","terms":[{"t":"Attitude","d":"The feelings or opinions a writer or character holds towards a subject.","e":"A narrator who describes his hometown as “a fine place to leave” reveals his feelings about it.","f":"Closely linked to tone: identify it, then prove it with word choices.","n":1},{"t":"Sardonic","d":"Grimly mocking, cynical or scornful.","e":"“Oh, wonderful,” he said with a grim little smile, as the last bus pulled away without him.","f":"Suggests bitterness or world-weariness."},{"t":"Nostalgia","d":"A sentimental longing for the past.","e":"The narrator lingers over the smell of her grandmother’s kitchen and summer evenings that “will never come again”.","f":"Often reveals dissatisfaction with the present."},{"t":"Pedantic","d":"Overly concerned with minor details, rules or showing off learning.","e":"“Actually, it’s an arachnid, not an insect — and technically you mean ‘fewer’, not ‘less’,” he corrected for the fifth time.","f":"Usually used to mock a character or tone."},{"t":"Catalog","d":"A list of people, things or attributes, often long and rhythmic.","e":"Whitman runs through the carpenter, the mason, the boatman, the shoemaker and the ploughboy, each singing his own song.","f":"Suggests abundance, variety or the scale of a subject."}]},{"title":"Saying it sideways","terms":[{"t":"Figure of Speech","d":"A word or phrase used in a non-literal or special way for effect.","e":"Metaphors, puns and oxymorons are all examples.","f":"Umbrella term: name the specific figure.","n":1,"u":1},{"t":"Paronomasia","d":"Wordplay based on words that sound alike or have several meanings.","e":"“A boiled egg every morning is hard to beat.”","f":"Adds wit and can sneak in a second meaning."},{"t":"Paraprosdokian","d":"A sentence whose ending is so unexpected that it forces you to reread the beginning.","e":"“Behind every great student is a mountain of unwashed laundry.”","f":"A comic surprise that flips expectations."},{"t":"Antiphrasis","d":"Using a word to mean its opposite, usually ironically.","e":"Calling an enormous bodybuilder “Tiny”.","f":"A compressed form of irony."},{"t":"Circumlocution","d":"Talking around a subject with unnecessarily many words, often to avoid saying it directly.","e":"Instead of “I lost your book,” he says, “It appears the item you kindly lent me has become temporarily unlocatable.”","f":"Can be evasive, comic or bureaucratic."}]},{"title":"Questions, lists and false impressions","terms":[{"t":"Hypophora","d":"Asking a question and then immediately answering it yourself.","e":"“What did we gain from the war? Nothing but graves.”","f":"Controls the argument by setting the question and supplying the answer."},{"t":"Enumeration","d":"Listing details, reasons or examples one by one.","e":"“There are three reasons I’m leaving: first, the pay; second, the hours; third, my manager.”","f":"Makes an argument seem organised and thorough."},{"t":"Snark","d":"Snide, sarcastic comments, often meant to be funny.","e":"A comment under a band’s comeback announcement: “Can’t wait to not listen to this.”","f":"Common in online and informal writing; signals contempt lightly."},{"t":"Illusion","d":"A false appearance or belief that misleads characters or readers.","e":"Gatsby’s glittering parties suggest a happy, successful man — but it is a carefully built false impression.","f":"Stories often turn on characters losing one of these."},{"t":"Distortion","d":"Twisting or exaggerating something so that it is presented inaccurately.","e":"A news report quotes half of a politician’s sentence so that she seems to say the opposite of what she meant.","f":"Ask what has been changed — and who benefits."}]},{"title":"Word games with grammar","terms":[{"t":"Trope","d":"A figure of speech that changes a word’s meaning; also a familiar convention used across many stories.","e":"Metaphor is a figure of this kind; “the chosen one” and “enemies to lovers” are story conventions of this kind.","f":"Spotting familiar patterns lets you see when a writer follows or breaks them.","n":1,"u":1},{"t":"Anthimeria","d":"Using a word as a different part of speech, such as a noun as a verb.","e":"“Let’s google it.” “I’ll text you.” “Don’t friend him.”","f":"Feels modern and energetic; shows language changing."},{"t":"Aphorismus","d":"Questioning whether a word is being used correctly, usually to criticise.","e":"“You call this a meal? I’ve seen more food on a doll’s plate.”","f":"Undermines something by challenging what it is called."},{"t":"Word Play","d":"Any clever or witty use of words for effect.","e":"Puns, double meanings, malapropisms and spoonerisms all count.","f":"Umbrella term: name the specific kind.","n":1,"u":1},{"t":"Sesquipedalian","d":"Using long, complicated words, often unnecessarily.","e":"“His perspicacious elucidation of the quintessential predicament was indubitably efficacious.”","f":"Often mocks a pompous character or writer."}]},{"title":"Kinds of speech I","terms":[{"t":"Diatribe","d":"A long, bitter, angry attack in speech or writing.","e":"A twenty-minute rant from a talk-show host attacking modern art as “fraudulent garbage”.","f":"Reveals the speaker’s anger more than it persuades."},{"t":"Encomium","d":"A speech or text written entirely to praise someone or something.","e":"A speech praising the humble potato as the unsung hero of human history.","f":"Can be sincere or used ironically for comic effect."},{"t":"Homily","d":"A sermon or moral talk, often explaining a religious text.","e":"After the reading, the priest gives a short talk on how the story of the lost sheep applies to daily life.","f":"Used loosely for any preachy, moralising speech."},{"t":"Apologia","d":"A formal written or spoken defence of one’s beliefs or actions.","e":"A disgraced athlete releases a long statement defending his choices and explaining why he made them.","f":"It defends rather than apologises."},{"t":"Parrhesia","d":"Speaking frankly and boldly, especially to someone in power, at personal risk.","e":"A junior employee stands up in the meeting: “With respect, sir, this plan will fail — and you know it.”","f":"Shows courage and integrity."}]},{"title":"Kinds of speech II","terms":[{"t":"Invective","d":"Insulting, abusive language used to attack someone.","e":"“You spineless, scheming, two-faced worm of a man!”","f":"Shows rage and contempt; can be comic or shocking.","x":["Harangue"]},{"t":"Harangue","d":"A long, loud, aggressive speech meant to lecture or rouse a crowd.","e":"The coach paces the locker room for half an hour, shouting about effort, pride and their pathetic first half.","f":"Overwhelms the listener rather than reasoning with them.","x":["Invective"]},{"t":"Exemplum","d":"A short story or anecdote used to illustrate a moral point, especially in a sermon.","e":"A preacher tells of a greedy merchant who lost everything, to show the dangers of greed.","f":"Makes an abstract lesson concrete and memorable."},{"t":"Eristic","d":"Arguing to win rather than to find the truth.","e":"Two debaters interrupt, twist each other’s words and score points without caring who is right.","f":"Signals bad faith in a debate."},{"t":"Platitude","d":"A dull, overused remark presented as if it were meaningful.","e":"“Everything happens for a reason,” she told her sobbing friend.","f":"Can show a character’s shallowness or discomfort with real emotion."}]},{"title":"Opinion and meaning","terms":[{"t":"Argument","d":"A reasoned case made to persuade others, built from claims, evidence and reasoning.","e":"An op-ed that states a position, supports it with evidence and answers the other side.","f":"In analysis, trace how the case is built and where it is weakest.","n":1},{"t":"Assertion","d":"A confident statement presented as fact, often without supporting evidence.","e":"“Social media is destroying our attention spans.”","f":"Sounds authoritative — so ask where the proof is.","x":["Subjective"]},{"t":"Vernacular","d":"The everyday language spoken by ordinary people in a particular place.","e":"A novel narrated in the everyday speech of a Glasgow housing estate rather than “proper” English.","f":"Gives authenticity and dignity to voices often excluded from literature."},{"t":"Subjective","d":"Based on personal feelings, tastes or opinions rather than facts.","e":"“This is the most beautiful song ever written.”","f":"Separating opinion from fact is central to analysing non-fiction.","x":["Assertion"]},{"t":"Semantic","d":"Relating to meaning in language.","e":"Arguing over whether a hot dog counts as a “sandwich” is really an argument about what a word means.","f":"A “semantic field” is a group of words linked by meaning, such as war words in a love poem."}]},{"title":"Genres II","terms":[{"t":"Mystery","d":"A story centred on a puzzle or crime, usually solved by gathering clues.","e":"A detective works out who poisoned the millionaire at his birthday dinner.","f":"Readers become detectives too, weighing every clue."},{"t":"Thriller","d":"A fast-paced story built on danger, suspense and high stakes.","e":"An agent has twenty-four hours to find a bomb hidden somewhere in the city.","f":"Keeps readers on edge through constant tension.","x":["Adventure"]},{"t":"Horror","d":"A story designed to frighten, disturb or disgust.","e":"Something is living inside the walls of the family’s new house, and each night it comes closer to the children’s room.","f":"Often reveals what a society fears."},{"t":"Fantasy","d":"Fiction set in an imaginary world with magic or supernatural elements.","e":"A world of dragons, enchanted swords and wizards, with its own invented history and maps.","f":"Uses invented worlds to explore real moral questions."},{"t":"Adventure","d":"A story full of exciting journeys, danger and daring action.","e":"A young sailor is shipwrecked, survives on an island, fights pirates and finds buried treasure.","f":"Celebrates courage, resourcefulness and discovery.","x":["Thriller"]}]},{"title":"Sound IV","terms":[{"t":"Dissonance","d":"Harsh, discordant sounds or words that clash, creating an unsettling effect.","e":"“Grating, snarling, splintering against the stone.”","f":"Disturbs the reader’s ear to mirror conflict or ugliness."},{"t":"Exact Rhyme","d":"A rhyme in which the vowel and final consonant sounds match exactly.","e":"“cat” and “hat”, “delight” and “tonight”","f":"Creates a satisfying, closed-off sound.","a":["perfect rhyme","full rhyme"]},{"t":"Feminine Rhyme","d":"A rhyme on two or more syllables, with the final syllable unstressed.","e":"“flower” and “power”, “running” and “cunning”","f":"Has a lighter, falling, sometimes comic feel.","x":["Exact Rhyme"]},{"t":"Sound Devices","d":"Techniques that use the sounds of words for effect.","e":"Alliteration, assonance, onomatopoeia and rhyme are all examples.","f":"Umbrella term: name the device and link the sound to meaning.","n":1,"u":1},{"t":"Prosody","d":"The study of rhythm, meter and sound patterns in poetry.","e":"Analysing how a poem’s stresses, line lengths and pauses work together.","f":"The technical name for the whole sound-and-rhythm toolkit.","n":1}]},{"title":"Sayings I","terms":[{"t":"Aphorism","d":"A short, memorable statement of a general truth, often by a known author.","e":"“Habit is a rope we weave one strand a day, until it holds us.”","f":"Gives authority and wisdom in very few words.","x":["Epigram","Proverb"]},{"t":"Proverb","d":"A traditional saying, passed down through generations, that offers advice.","e":"“Don’t count your chickens before they hatch.”","f":"Draws on shared, folk wisdom.","x":["Aphorism"]},{"t":"Motto","d":"A short phrase that sums up the beliefs or goals of a person, group or institution.","e":"A school crest reads: “Strive, Serve, Succeed.”","f":"Expresses identity and values."},{"t":"Epigram","d":"A short, witty, often paradoxical statement.","e":"“I can resist everything except temptation.” (Oscar Wilde)","f":"The twist makes it clever and quotable.","x":["Aphorism"]},{"t":"Mnemonic","d":"A pattern of words or letters that helps you remember something.","e":"“Richard Of York Gave Battle In Vain” for the colours of the rainbow.","f":"A memory aid rather than a literary device."}]},{"title":"Sayings II","terms":[{"t":"Adage","d":"An old, familiar saying that has gained credibility through long use.","e":"“Where there’s smoke, there’s fire.”","f":"Appeals to common sense and tradition.","x":["Maxim","Truism"]},{"t":"Maxim","d":"A short statement of a general rule of conduct.","e":"“Never put off till tomorrow what you can do today.”","f":"Tells you how to behave.","x":["Adage"]},{"t":"Truism","d":"A statement so obviously true that it hardly needs saying.","e":"“Nobody’s perfect.”","f":"Can sound wise while saying very little.","x":["Adage","Maxim"]},{"t":"Moral","d":"The lesson a story teaches.","e":"At the end of “The Tortoise and the Hare”: slow and steady wins the race.","f":"Ask whether the lesson is stated outright or left for the reader to work out.","x":["Adage"]},{"t":"Epitaph","d":"A short inscription or poem in memory of someone who has died, often carved on a gravestone.","e":"Carved on a headstone: “She loved the sea, and now she rests beside it.”","f":"Sums up a life in a few words."}]},{"title":"Traditional stories I","terms":[{"t":"Fable","d":"A short story, often with animals as characters, that teaches a lesson.","e":"The Fox and the Grapes: a fox who can’t reach some grapes decides they were probably sour anyway.","f":"Simple on the surface, pointed underneath.","a":["apologue"]},{"t":"Parable","d":"A simple story about ordinary people that teaches a moral or spiritual lesson.","e":"The Good Samaritan: a traveller from a despised group is the only one who helps a beaten stranger.","f":"Invites listeners to apply the lesson to their own lives."},{"t":"Myth","d":"An ancient traditional story, often involving gods, that explains the world or a culture’s beliefs.","e":"Prometheus steals fire from the gods and gives it to humanity — and is punished forever.","f":"Writers often borrow these stories to give their own work weight."},{"t":"Legend","d":"A traditional story about a figure or event that may have a historical basis but has been exaggerated over time.","e":"Robin Hood: a possibly real outlaw, embroidered with new adventures over centuries of retelling.","f":"Mixes history and imagination."},{"t":"Fairy Tale","d":"A folk story for children with magic, wonder and often a happy ending.","e":"A girl, a wicked stepmother, a fairy godmother, a pumpkin carriage and a midnight deadline.","f":"Many modern stories rework these, often darkly."}]},{"title":"Traditional stories II","terms":[{"t":"Folklore","d":"The traditional beliefs, customs, stories and songs of a community, passed on by word of mouth.","e":"Villagers warn children never to cut their nails after dark and sing the same harvest songs their grandparents sang.","f":"Shows a community’s values and fears."},{"t":"Urban Legend","d":"A modern story passed on as true, usually shocking, that can’t be traced to a real source.","e":"“My cousin’s friend found a finger in her burger” — no one can ever trace who it actually happened to.","f":"Reveals modern anxieties."},{"t":"Quest","d":"A story in which a hero travels to find something or achieve a difficult goal.","e":"A small hobbit sets out on a long, dangerous journey to destroy a powerful ring.","f":"The journey usually changes the hero as much as the goal does."},{"t":"Romance","d":"A story centred on love; historically, also medieval tales of knights, chivalry and adventure.","e":"Two people meet, misunderstand each other, overcome obstacles and fall in love.","f":"Ask what the love story says about society’s rules and expectations."},{"t":"Narrative Poem","d":"A poem that tells a story.","e":"Coleridge’s “The Rime of the Ancient Mariner” tells of a sailor cursed for shooting an albatross.","f":"Combines storytelling with the music of verse."}]},{"title":"Parts of a book","terms":[{"t":"Epigraph","d":"A short quotation placed at the start of a book or chapter to suggest its theme.","e":"Before chapter one, the novelist prints a single line from a Keats poem in italics.","f":"A clue to how the writer wants the work to be read."},{"t":"Foreword","d":"A short introduction to a book, often written by someone other than the author.","e":"A famous novelist writes a few pages introducing a new edition of a classic.","f":"Frames how readers approach the book."},{"t":"Anthology","d":"A published collection of poems, stories or essays by different writers.","e":"A book gathering fifty short stories by different authors about growing up.","f":"The selection itself makes an argument about what matters."},{"t":"Canon","d":"The body of works generally accepted as the most important in a literature.","e":"The plays of Shakespeare and the novels of Austen and Dickens.","f":"Constantly debated: whose voices are included, and whose are left out?"},{"t":"Genre","d":"A category of literature with shared conventions, such as tragedy, poetry, science fiction or memoir.","e":"Readers expect a detective, clues and a solution from a crime novel.","f":"Writers create meaning by following or breaking these expectations.","n":1}]},{"title":"Prose forms","terms":[{"t":"Novel","d":"A long work of fiction in prose, usually with many characters and plotlines.","e":"Pride and Prejudice: hundreds of pages of fictional prose following several families.","f":"The length allows complex characters and themes."},{"t":"Novella","d":"A work of prose fiction longer than a short story but much shorter than a full-length book.","e":"Of Mice and Men — a complete story of about 30,000 words.","f":"Focused and intense, usually on one main conflict."},{"t":"Short Story","d":"A brief work of prose fiction that can be read in one sitting.","e":"A 3,000-word piece of fiction about a single evening in a family’s kitchen.","f":"Every detail has to earn its place."},{"t":"Prose","d":"Ordinary written language in sentences and paragraphs, rather than in lines of verse.","e":"Novels, essays, articles and this definition are all written this way.","f":"Contrast with verse.","n":1},{"t":"Fiction","d":"Writing about imagined people and events.","e":"Novels, short stories and plays that tell invented stories.","f":"Even invented stories make claims about real life.","n":1}]},{"title":"Life writing and drama","terms":[{"t":"Memoir","d":"A writer’s account of one part or theme of their own life.","e":"A writer describes the single year she spent caring for her dying father.","f":"Focuses on memory and meaning rather than a full life history.","x":["Autobiography"]},{"t":"Autobiography","d":"A person’s account of their whole life, written by themselves.","e":"A former president tells his life story from childhood to retirement.","f":"Shapes the writer’s own legacy — read with that in mind.","x":["Memoir"]},{"t":"Biography","d":"An account of a person’s life written by someone else.","e":"A historian’s 600-page account of the life of Marie Curie.","f":"The writer selects and interprets — so check their perspective."},{"t":"Drama","d":"Literature written to be performed by actors; also any serious play.","e":"Plays by Shakespeare, Miller and Williams.","f":"Umbrella term: remember stage directions, performance and audience.","n":1,"u":1},{"t":"Play","d":"A script written to be performed, with dialogue and stage directions, divided into acts and scenes.","e":"A script headed “ACT ONE, Scene 2”, with character names before each line and directions in italics.","f":"Analyse it as something seen and heard, not just read."}]},{"title":"Poems, letters and characters","terms":[{"t":"Epistle","d":"A formal letter, often written as a poem or a work of instruction.","e":"Alexander Pope addresses a whole poem, as a formal letter, to his friend and doctor, John Arbuthnot.","f":"The letter form creates a direct, personal address."},{"t":"Poem","d":"A piece of writing in lines that uses rhythm, sound and imagery to express ideas and feelings.","e":"A sonnet, a haiku or a free-verse piece about the sea.","f":"Umbrella term: name the form.","n":1,"u":1},{"t":"Metaphysical","d":"Describes 17th-century poets like John Donne, known for clever arguments, startling comparisons and big questions about love, God and death.","e":"Donne argues with Death, compares lovers to a compass and treats a flea as a marriage bed.","f":"Witty, intellectual and surprising."},{"t":"Character","d":"A person, animal or figure in a story.","e":"Heroes, villains, narrators and minor figures alike.","f":"Umbrella term: discuss how a character is built and what they represent.","n":1,"u":1},{"t":"Narrative","d":"An account of connected events — a story, true or invented.","e":"A novel, a news report and a friend’s description of their weekend all tell one.","f":"Umbrella term: ask who tells it, how, and why.","n":1,"u":1}]},{"title":"Essay types I","terms":[{"t":"Analytical Essay","d":"An essay that examines how a text or idea works by breaking it into parts.","e":"A piece examining how Fitzgerald uses the green light to explore Gatsby’s longing.","f":"The core form of literary criticism."},{"t":"Argumentative Essay","d":"An essay that takes a position and defends it with evidence and counter-arguments.","e":"A piece arguing, with evidence and rebuttals, that homework should be banned in primary schools.","f":"Balanced reasoning wins over the reader.","x":["Persuasive Essay"]},{"t":"Expository Essay","d":"An essay that explains or informs, without arguing for a position.","e":"A piece explaining how vaccines train the immune system.","f":"Clarity and accuracy matter most."},{"t":"Persuasive Essay","d":"An essay that tries to convince the reader, often using emotional as well as logical appeals.","e":"A passionate school-newspaper piece urging students to boycott single-use plastics.","f":"More emotional and one-sided than an argumentative essay.","x":["Argumentative Essay"]},{"t":"Essay","d":"A short piece of non-fiction writing on a particular subject.","e":"A few pages exploring a single idea, argument or experience.","f":"Umbrella term: the type depends on its purpose.","n":1,"u":1}]},{"title":"Essay types II","terms":[{"t":"Cause and Effect Essay","d":"An essay that explains why something happened and what resulted.","e":"A piece tracing how the printing press led to the spread of literacy and then the Reformation.","f":"Links events in a chain of consequences."},{"t":"Comparison and Contrast Essay","d":"An essay examining the similarities and differences between two subjects.","e":"A piece weighing up the similarities and differences between Romeo and Juliet and West Side Story.","f":"The skill behind every comparative essay."},{"t":"Critical Essay","d":"An essay that evaluates a work, judging its strengths and weaknesses.","e":"A piece judging whether a film adaptation of a novel succeeds or fails.","f":"Requires a clear judgement backed by evidence."},{"t":"Explicatory Essay","d":"An essay that explains a short text in close detail, often line by line.","e":"A close, line-by-line piece unpacking the meaning of a single short poem.","f":"Close reading at its most focused."},{"t":"Process Essay","d":"An essay that explains how to do something or how something happens, step by step.","e":"“How to Bake Sourdough Bread in Ten Steps.”","f":"Clear order and transitions are essential."}]},{"title":"Writing about texts","terms":[{"t":"Critique","d":"A detailed evaluation of a work, weighing its strengths and weaknesses.","e":"A reviewer weighs a novel’s beautiful prose against its weak ending and gives it three stars.","f":"Judgement plus evidence, not just opinion."},{"t":"Explication","d":"A detailed explanation of a text’s meaning, often line by line.","e":"A teacher unpacks a sonnet line by line, explaining each image and what it means.","f":"Close reading made explicit."},{"t":"Paraphrase","d":"Restating a text in your own words.","e":"Restating “To be or not to be, that is the question” as “Is it better to live or to die?”","f":"Useful for understanding — but analysis must go beyond it."},{"t":"Synopsis","d":"A brief summary of the main points of a story or argument.","e":"The back-cover blurb: a lonely orphan discovers he is a wizard and is invited to a magical school.","f":"Tells you what happens, not how or why it matters."},{"t":"Discourse","d":"Written or spoken communication, especially the ways a topic is talked about in a society.","e":"The way newspapers, politicians and social media talk about immigration forms a particular kind.","f":"A key Lang & Lit idea: language shapes how we think about an issue.","n":1}]},{"title":"Building a paragraph","terms":[{"t":"Main Idea","d":"The central point of a paragraph or text.","e":"“Regular exercise improves mental health” — the point every other sentence in the paragraph supports.","f":"Find it first, then see how it is supported.","x":["Supporting Sentence"]},{"t":"Supporting Sentence","d":"A sentence that backs up a paragraph’s main point with evidence, examples or explanation.","e":"“For example, one study found that students who ran three times a week reported less anxiety.”","f":"The evidence layer of a paragraph."},{"t":"Simple Paragraph","d":"A basic paragraph built around one idea: a topic sentence, supporting details and a conclusion.","e":"One paragraph that opens with its point, gives three pieces of support and closes by restating it.","f":"The building block of clear essays."},{"t":"Coherence","d":"The quality of writing in which ideas connect logically and flow clearly.","e":"An essay where each paragraph follows naturally from the last, so the reader never feels lost.","f":"Created by clear structure and linking words."},{"t":"Transition","d":"A word or phrase that links ideas, sentences or paragraphs.","e":"“However”, “Furthermore”, “As a result”, “In contrast”","f":"Signals the relationship between ideas."}]},{"title":"Grammar I","terms":[{"t":"Appositive","d":"A noun or noun phrase placed next to another to rename or describe it.","e":"“My neighbour, a retired pilot, still checks the sky every morning.”","f":"Packs extra information into a sentence economically."},{"t":"Antecedent","d":"The word that a pronoun refers back to.","e":"In “Maria lost her keys”, “Maria” is the word that “her” points back to.","f":"Unclear ones cause confusion: who does “he” mean?"},{"t":"Expletive","d":"A word like “there” or “it” that fills a grammatical slot without adding meaning; also a swear word.","e":"“There are three cats on the roof.” “It is raining.”","f":"Too many weaken writing; in speech, the swear-word sense shows strong emotion."},{"t":"Run-On Sentence","d":"Two or more independent clauses joined without proper punctuation or conjunctions.","e":"“I love reading I read every night I can’t stop.”","f":"Usually an error — but can be used deliberately to show breathless thought."},{"t":"Synonym","d":"A word with the same or nearly the same meaning as another.","e":"“Happy”, “joyful”, “cheerful” and “content”","f":"Synonyms are rarely identical: the differences in connotation are what matter."}]},{"title":"Grammar II","terms":[{"t":"Anacoluthon","d":"A sentence that changes its grammatical structure partway through.","e":"“If you think I’m going to — well, who cares what you think?”","f":"Mimics agitated or confused speech."},{"t":"Solecism","d":"A grammatical mistake or breach of etiquette.","e":"“Me and him was going to the shops.”","f":"In fiction, it can characterise a speaker’s background or education."},{"t":"Synesis","d":"Grammatical agreement based on meaning rather than strict form.","e":"“The team are celebrating their victory.” (the team is treated as a group of players)","f":"Common in British English and in natural speech."},{"t":"Pleonasm","d":"Using more words than needed to express an idea, sometimes for emphasis.","e":"“I saw it with my own eyes.”","f":"Can add emphasis — or simply be wordy."},{"t":"Homograph","d":"A word spelled the same as another but with a different meaning, and sometimes a different pronunciation.","e":"“lead” (the metal) and “lead” (to guide); “bow” (a knot) and “bow” (to bend forward)","f":"A source of puns and ambiguity."}]},{"title":"Word relationships","terms":[{"t":"Homonyms","d":"Words that sound the same and are spelled the same but have different meanings.","e":"“bat” (the animal) and “bat” (for cricket)","f":"A source of puns and confusion.","x":["Homophone"]},{"t":"Homophone","d":"Words that sound the same but have different meanings and spellings.","e":"“their”, “there” and “they’re”","f":"Powers many puns — and spelling mistakes.","x":["Homonyms"]},{"t":"Tautology","d":"Saying the same thing twice in different words, unnecessarily.","e":"“Let’s start the meeting at 9 a.m. in the morning.”","f":"Usually a flaw — though it can be used deliberately for emphasis."},{"t":"Etymology","d":"The origin and history of a word.","e":"“Disaster” comes from words meaning “bad star” — misfortune was once blamed on the planets.","f":"Knowing a word’s roots can reveal hidden layers of meaning."},{"t":"Pseudonym","d":"A false name used by an author.","e":"Mary Ann Evans published her novels as George Eliot.","f":"Often reveals something about the writer’s context — such as attitudes to women writers."}]},{"title":"Word surgery","terms":[{"t":"Elision","d":"Leaving out a sound or syllable, often to fit a poem’s meter.","e":"“Th’expense of spirit” — “the” is shortened to run into the next word.","f":"Keeps the rhythm regular and the line flowing.","x":["Syncope"]},{"t":"Syncope","d":"Dropping letters or sounds from the middle of a word.","e":"“ev’ry” for “every”, “fam’ly” for “family”","f":"Fits the meter or imitates casual speech.","x":["Elision"]},{"t":"Prosthesis","d":"Adding a sound or syllable to the beginning of a word.","e":"“The fox went a-hunting in the night.”","f":"Gives an old-fashioned or rhythmic feel."},{"t":"Tmesis","d":"Splitting a word or phrase by inserting another word into it.","e":"“Abso-bloody-lutely!”","f":"Adds emphasis, humour or force."},{"t":"Ordinal Number","d":"A number word that shows position or order.","e":"“first”, “second”, “twenty-third”","f":"Used to structure lists and arguments clearly."}]},{"title":"Word puzzles","terms":[{"t":"Acrostic","d":"A poem or text in which the first letters of each line spell out a word or message.","e":"A poem whose lines begin with A, N, N and A, spelling a friend’s name down the page.","f":"A hidden message woven into the form."},{"t":"Anagram","d":"A word or phrase formed by rearranging the letters of another.","e":"“listen” rearranged into “silent”","f":"Used in puzzles, pen names and hidden clues."},{"t":"Palindrome","d":"A word or phrase that reads the same backwards as forwards.","e":"“Was it a car or a cat I saw?”","f":"A playful, symmetrical form of wordplay."},{"t":"Rebus","d":"A puzzle that uses pictures or symbols to represent words or syllables.","e":"A drawing of an eye, a heart and a sheep (ewe) means “I love you”.","f":"A visual form of wordplay."},{"t":"Riddle","d":"A question or statement phrased as a puzzle, with a clever or surprising answer.","e":"“What has keys but can’t open locks?” (A piano.)","f":"Rewards lateral thinking."}]},{"title":"Last odds and ends","terms":[{"t":"Conundrum","d":"A confusing, difficult problem — or a riddle whose answer involves a pun.","e":"“What’s the difference between a cat and a comma? One has claws at the end of its paws; the other is a pause at the end of a clause.”","f":"In everyday use, simply a hard puzzle or dilemma."},{"t":"Antistrophe","d":"In a Greek choral ode, the stanza that answers the first one, matching its meter.","e":"In a Greek tragedy, the chorus sings a stanza, then a second one in the same meter in reply, moving back across the stage.","f":"In rhetoric, the name is also used for epistrophe."},{"t":"Comparison","d":"Showing how two things are alike, or how they differ.","e":"Placing two characters, two poems or two ideas side by side to weigh them up.","f":"Umbrella term: similes, metaphors and analogies are all kinds of it.","n":1,"u":1},{"t":"Humor","d":"Anything intended to make an audience laugh or smile.","e":"Wit, puns, satire, slapstick and irony can all create it.","f":"Umbrella term: ask what the humour achieves, not just whether it is funny.","n":1,"u":1,"a":["humour"]},{"t":"Trimeter","d":"A line of poetry with three metrical feet.","e":"“I wish I were a bird” (da-DUM, da-DUM, da-DUM)","f":"Short lines feel quick, light or song-like."}]}]</script>
<script>
(function () {
  "use strict";
  var DAYS = JSON.parse(document.getElementById("days-data").textContent);
  var TERMS = [];
  DAYS.forEach(function (day, di) {
    day.terms.forEach(function (t, ti) { t.di = di; t.ti = ti; TERMS.push(t); });
  });
  var TOTAL_TERMS = TERMS.length;
  var INTERVALS = [1, 2, 4, 8, 16, 32];
  var KEY = "term-by-term-v1";

  // ---------- dates ----------
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDays(s, n) {
    var p = s.split("-").map(Number);
    return todayStr(new Date(p[0], p[1] - 1, p[2] + n));
  }
  function fmtDate(s) {
    var p = s.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function mentions(text, name) {
    var re = new RegExp("\\b" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
    return re.test(text);
  }

  // ---------- state ----------
  function blankState() { return { v: 1, updatedAt: 0, day: 0, log: [], stats: {}, lesson: null }; }
  function validState(s) { return s && typeof s === "object" && typeof s.day === "number" && Array.isArray(s.log) && s.stats && typeof s.stats === "object"; }
  function loadLocal() {
    try { var raw = localStorage.getItem(KEY); if (!raw) return null; var s = JSON.parse(raw); return validState(s) ? s : null; } catch (e) { return null; }
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }

  var state = loadLocal() || blankState();
  var remoteRef = null, saving = false, pendingSave = false, retryTimer = null;
  var syncMode = "pending"; // pending | account | local

  function persist() {
    state.updatedAt = Date.now();
    saveLocal();
    pushRemote();
  }
  function pushRemote() {
    if (!remoteRef) return;
    if (saving) { pendingSave = true; return; }
    saving = true;
    remoteRef.set(JSON.parse(JSON.stringify(state))).then(function () {
      if (syncMode !== "account") { syncMode = "account"; renderSync(); }
    }, function (e) {
      var code = e && e.code;
      if (code === "unavailable" || code === "resource_exhausted") {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(pushRemote, 2000 + Math.random() * 2000);
      } else {
        remoteRef = null; syncMode = "local"; renderSync();
      }
    }).then(function () {
      saving = false;
      if (pendingSave) { pendingSave = false; pushRemote(); }
    });
  }
  function initRemote() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { syncMode = "local"; renderSync(); return; }
    Promise.all([c.use("user"), c.use("db")]).then(function (res) {
      var user = res[0], db = res[1];
      if (!user || !db) { syncMode = "local"; renderSync(); return null; }
      return user.id().then(function (uid) {
        if (!uid) { syncMode = "local"; renderSync(); return; }
        var ref = db.doc("data/users/" + uid + "/progress");
        return ref.get().then(function (snap) {
          remoteRef = ref;
          var remote = snap.exists ? snap.data() : null;
          if (remote && validState(remote) && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
            state = JSON.parse(JSON.stringify(remote));
            saveLocal();
            syncMode = "account";
            if (view === "home" || view === "glossary") render(); else renderSync();
          } else if (state.updatedAt > 0) {
            pushRemote();
          } else {
            syncMode = "account"; renderSync();
          }
        });
      });
    }).catch(function () { remoteRef = null; syncMode = "local"; renderSync(); });
  }

  // ---------- derived ----------
  function learnedTerms() { return TERMS.filter(function (t) { return t.di < state.day; }); }
  function dayLog() { return state.log.filter(function (e) { return e.k === "day"; }); }
  function lastDayEntry() { var l = dayLog(); return l.length ? l[l.length - 1] : null; }
  function doneToday() { var l = lastDayEntry(); return !!(l && l.date === todayStr()); }
  function streak() {
    var dates = {}; dayLog().forEach(function (e) { dates[e.date] = true; });
    var d = todayStr(); if (!dates[d]) d = addDays(d, -1);
    var n = 0; while (dates[d]) { n++; d = addDays(d, -1); }
    return n;
  }
  function statOf(t) { return state.stats[t.t] || null; }
  function isDue(t, today) { var s = statOf(t); return !s || s.due <= today; }
  function dueTerms() { var today = todayStr(); return learnedTerms().filter(function (t) { return isDue(t, today); }); }
  function isShaky(t) { var s = statOf(t); return !!(s && s.b === 0 && s.w > 0); }
  function isSolid(t) { var s = statOf(t); return !!(s && s.b >= 3); }

  // ---------- quiz building ----------
  function related(a, b) { return (a.x || []).indexOf(b.t) >= 0 || (b.x || []).indexOf(a.t) >= 0; }
  function okDistractor(t, o, type) {
    if (o === t) return false;
    if (type === "ex") { if (o.u || related(t, o) || mentions(t.e, o.t)) return false; }
    if (type === "def" && mentions(t.d, o.t)) return false;
    if (type === "term" && (mentions(o.d, t.t) || o.d === t.d)) return false;
    return true;
  }
  function pickDistractors(t, type) {
    var picked = shuffle(DAYS[t.di].terms.filter(function (o) { return okDistractor(t, o, type); })).slice(0, 3);
    if (picked.length < 3) {
      var limit = Math.max(state.day, t.di + 1);
      var known = shuffle(TERMS.filter(function (o) { return o.di < limit && o.di !== t.di && okDistractor(t, o, type); }));
      while (picked.length < 3 && known.length) picked.push(known.pop());
    }
    if (picked.length < 3) {
      var rest = shuffle(TERMS.filter(function (o) { return picked.indexOf(o) < 0 && o.di !== t.di && okDistractor(t, o, type); }));
      while (picked.length < 3 && rest.length) picked.push(rest.pop());
    }
    return picked;
  }
  function makeQ(t, type, isNew) {
    var opts = shuffle(pickDistractors(t, type).concat([t]));
    return { term: t, type: type, isNew: isNew, options: opts, answer: opts.indexOf(t), chosen: -1, correct: false };
  }
  function reviewType(t) {
    if (t.n) return Math.random() < 0.5 ? "def" : "term";
    var r = Math.random();
    return r < 0.5 ? "ex" : (r < 0.8 ? "def" : "term");
  }
  function spread(qs) {
    for (var i = 1; i < qs.length; i++) {
      if (qs[i].term === qs[i - 1].term) {
        for (var j = i + 1; j < qs.length; j++) {
          if (qs[j].term !== qs[i - 1].term && (j + 1 >= qs.length || qs[j + 1].term !== qs[i].term)) { var tmp = qs[i]; qs[i] = qs[j]; qs[j] = tmp; break; }
        }
      }
    }
    return qs;
  }
  function pickReview(max, excludeDi) {
    var today = todayStr();
    return TERMS.filter(function (t) { return t.di < state.day && t.di !== excludeDi && isDue(t, today); })
      .map(function (t) { var s = statOf(t) || { b: 0, due: "" }; return { t: t, b: s.b, due: s.due, r: Math.random() }; })
      .sort(function (a, b) { return a.b - b.b || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0) || a.r - b.r; })
      .slice(0, max).map(function (x) { return x.t; });
  }
  function buildDayQuiz(di) {
    var qs = [];
    DAYS[di].terms.forEach(function (t) {
      qs.push(makeQ(t, "def", true));
      qs.push(makeQ(t, t.n ? "term" : "ex", true));
    });
    pickReview(5, di).forEach(function (t) { qs.push(makeQ(t, reviewType(t), false)); });
    return spread(shuffle(qs));
  }
  function buildPractice() {
    var today = todayStr();
    var pool = learnedTerms().map(function (t) {
      var s = statOf(t) || { b: 0, due: "" };
      return { t: t, k: (isDue(t, today) ? 0 : 10) + s.b + Math.random() * 2 };
    }).sort(function (a, b) { return a.k - b.k; }).slice(0, 10).map(function (x) { return x.t; });
    return shuffle(pool.map(function (t) { return makeQ(t, reviewType(t), false); }));
  }

  // ---------- view state ----------
  var view = "home";
  var session = null;
  var gloss = { q: "", filter: "learned" };
  var confirmReset = false;

  function go(v) { view = v; render(); window.scrollTo(0, 0); }

  function startLesson(mode, di) {
    var step = 0;
    if (mode === "day" && state.lesson && state.lesson.d === di && state.lesson.step < 5) step = state.lesson.step;
    session = { mode: mode, di: di, step: step };
    go("lesson");
  }
  function setStep(n) {
    session.step = n;
    if (session.mode === "day") { state.lesson = { d: session.di, step: n }; persist(); }
    render(); window.scrollTo(0, 0);
  }
  function startDayQuiz(di) {
    session = { mode: "day", di: di, questions: buildDayQuiz(di), qi: 0, answered: false };
    state.lesson = { d: di, step: 5 }; persist();
    go("quiz");
  }
  function startPractice() {
    session = { mode: "practice", questions: buildPractice(), qi: 0, answered: false };
    go("quiz");
  }
  function answer(i) {
    if (!session || session.answered) return;
    var q = session.questions[session.qi];
    q.chosen = i; q.correct = i === q.answer; session.answered = true;
    render();
    var nb = document.getElementById("next-q"); if (nb) nb.focus({ preventScroll: true });
    var fb = document.getElementById("feedback"); if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest" });
  }
  function nextQ() {
    session.qi++; session.answered = false;
    if (session.qi >= session.questions.length) finishQuiz(); else { render(); window.scrollTo(0, 0); }
  }
  function finishQuiz() {
    var today = todayStr();
    var rows = [], byName = {};
    session.questions.forEach(function (q) {
      var r = byName[q.term.t];
      if (!r) { r = byName[q.term.t] = { t: q.term, isNew: q.isNew, right: 0, total: 0 }; rows.push(r); }
      r.total++; if (q.correct) r.right++;
    });
    rows.forEach(function (r) {
      var s = state.stats[r.t.t] || { b: 0, due: today, c: 0, w: 0 };
      s.c += r.right; s.w += r.total - r.right;
      var perfect = r.right === r.total;
      if (r.isNew) s.b = perfect ? 1 : 0;
      else s.b = perfect ? Math.min(s.b + 1, INTERVALS.length - 1) : 0;
      s.due = addDays(today, INTERVALS[s.b]);
      state.stats[r.t.t] = s;
    });
    var score = session.questions.filter(function (q) { return q.correct; }).length;
    var total = session.questions.length;
    if (session.mode === "day") {
      state.log.push({ k: "day", d: session.di, date: today, s: score, n: total });
      if (state.day <= session.di) state.day = session.di + 1;
      state.lesson = null;
    } else {
      state.log.push({ k: "practice", date: today, s: score, n: total });
      var practice = state.log.filter(function (e) { return e.k === "practice"; });
      if (practice.length > 60) { var drop = practice[0]; state.log.splice(state.log.indexOf(drop), 1); }
    }
    persist();
    session.summary = { score: score, total: total, rows: rows };
    go("results");
  }

  // ---------- rendering ----------
  var app = document.getElementById("app");

  function header() {
    return '<header class="top">' +
      '<button class="brand" data-act="home" aria-label="Term by Term, home"><span>Term by Term</span></button>' +
      '<nav class="tabs" aria-label="Sections">' +
      '<button data-act="home"' + (view === "glossary" ? "" : ' aria-current="page"') + '>Today</button>' +
      '<button data-act="glossary"' + (view === "glossary" ? ' aria-current="page"' : "") + '>Glossary</button>' +
      '</nav></header>';
  }

  function syncText() {
    if (syncMode === "account") return "Progress is saved to your account, so it follows you to any device where you open this page.";
    if (syncMode === "local") return "Progress is saved in this browser. Open the page in the same browser each day to keep it.";
    return "Loading your saved progress…";
  }
  function renderSync() { var el = document.getElementById("sync-note"); if (el) el.textContent = syncText(); }

  function renderHome() {
    var today = todayStr();
    var learned = learnedTerms().length;
    var due = state.day ? dueTerms().length : 0;
    var html = header();
    var di = state.day;
    if (di >= DAYS.length) {
      html += '<section class="card today"><p class="eyebrow">All 87 days complete</p><h1>You have learned every term on the list</h1>' +
        '<p>Keep them fresh with quick reviews — the terms you miss come back sooner.</p>' +
        '<div class="row"><button class="btn primary" data-act="practice">Start a quick review</button></div></section>';
    } else if (doneToday()) {
      var last = lastDayEntry();
      var next = DAYS[di];
      html += '<section class="card today"><p class="eyebrow">Day ' + (last.d + 1) + ' done · ' + esc(fmtDate(today)) + '</p>' +
        '<h1>That’s today’s five</h1>' +
        '<p>You scored <span class="score-inline">' + last.s + '/' + last.n + '</span> on the quiz. Day ' + (di + 1) + ', “' + esc(next.title) + '”, is ready tomorrow.</p>' +
        '<div class="row"><button class="btn secondary" data-act="early">Start Day ' + (di + 1) + ' now</button>' +
        '<button class="btn ghost" data-act="revisit" data-day="' + last.d + '">Revisit today’s terms</button></div></section>';
    } else {
      var day = DAYS[di];
      var inQuiz = state.lesson && state.lesson.d === di && state.lesson.step >= 5;
      var midLesson = state.lesson && state.lesson.d === di && state.lesson.step > 0 && state.lesson.step < 5;
      var label = inQuiz ? "Take the quiz" : (midLesson ? "Continue lesson (term " + (state.lesson.step + 1) + " of 5)" : "Start today’s lesson");
      html += '<section class="card today"><p class="eyebrow">Day ' + (di + 1) + ' of ' + DAYS.length + ' · ' + esc(fmtDate(today)) + '</p>' +
        '<h1>' + esc(day.title) + '</h1>' +
        '<ul class="chips">' + day.terms.map(function (t) { return "<li>" + esc(t.t) + "</li>"; }).join("") + '</ul>' +
        '<p class="muted small">Learn 5 terms, then take a 10-question quiz' + (state.day ? ', plus up to 5 review questions on earlier terms.' : '.') + '</p>' +
        '<div class="row"><button class="btn primary" data-act="' + (inQuiz ? "quiz" : "lesson") + '">' + label + '</button>' +
        (inQuiz ? '<button class="btn ghost" data-act="relesson">Read the terms again</button>' : "") + '</div></section>';
    }

    html += '<section class="stats" aria-label="Your progress">' +
      '<div class="stat"><b>' + learned + '</b><span>of ' + TOTAL_TERMS + ' terms learned</span></div>' +
      '<div class="stat"><b>' + streak() + '</b><span>day streak</span></div>' +
      '<div class="stat"><b>' + due + '</b><span>due for review</span></div></section>';

    html += '<section class="mapwrap" aria-label="Course map"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem">The 87-day course</h2>' +
      '<span class="muted small">Tap a finished day to reread it</span></div><div class="map">';
    DAYS.forEach(function (d, i) {
      var name = "Day " + (i + 1) + ": " + d.title;
      if (i < state.day) html += '<button class="cell done" data-act="revisit" data-day="' + i + '" title="' + esc(name) + '" aria-label="' + esc(name) + ', finished"></button>';
      else if (i === state.day) html += '<span class="cell now" title="' + esc(name) + '" aria-label="' + esc(name) + ', up next"></span>';
      else html += '<span class="cell" title="' + esc(name) + '" aria-label="' + esc(name) + '"></span>';
    });
    html += '</div><div class="legend"><span><i class="d"></i>Finished</span><span><i class="n"></i>Up next</span><span><i></i>Still to come</span></div></section>';

    if (state.day > 0) {
      html += '<section class="card"><h2 style="font-size:1.25rem">Quick review</h2>' +
        '<p>Ten questions on terms you have already learned, starting with the ones that are due or that you got wrong.</p>' +
        '<div class="row"><button class="btn secondary" data-act="practice">Start a quick review</button></div></section>';
    }

    html += '<footer class="foot"><p id="sync-note">' + esc(syncText()) + '</p>';
    if (confirmReset) {
      html += '<div class="confirm"><p>Reset all progress? This clears every day, score and review date, and starts you again at Day 1.</p>' +
        '<div class="row"><button class="btn danger" data-act="reset-yes">Reset progress</button><button class="btn ghost" data-act="reset-no">Keep my progress</button></div></div>';
    } else if (state.updatedAt) {
      html += '<p><button class="btn link" data-act="reset">Reset progress</button></p>';
    }
    html += '<p>Terms follow the list on literarydevices.net; definitions and examples are written fresh for this page.</p></footer>';
    app.innerHTML = html;
  }

  function renderLesson() {
    var day = DAYS[session.di];
    var t = day.terms[session.step];
    var last = session.step === 4;
    var html = '<div class="topline"><button class="btn ghost" data-act="home">← Home</button>' +
      '<span class="muted small">Day ' + (session.di + 1) + ' · ' + esc(day.title) + ' · Term ' + (session.step + 1) + ' of 5</span></div>';
    html += '<article class="entry"><h2 class="headword"><span>' + esc(t.t) + '</span></h2>' +
      (t.a ? '<p class="aka">Also called ' + t.a.map(esc).join(", ") + '</p>' : "") +
      '<p class="def">' + esc(t.d) + '</p>' +
      '<figure class="example"><span class="label">Example</span><p>' + esc(t.e) + '</p></figure>' +
      (t.f ? '<div class="why"><span class="label">In your analysis</span><p>' + esc(t.f) + '</p></div>' : "") +
      '</article>';
    html += '<div class="dots" aria-hidden="true">' + [0, 1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= session.step ? "on" : "") + '"></i>'; }).join("") + '</div>';
    html += '<div class="navrow"><button class="btn ghost" data-act="prev"' + (session.step === 0 ? " disabled" : "") + '>Previous</button>';
    if (!last) html += '<button class="btn primary" data-act="next">Next term</button>';
    else if (session.mode === "day") html += '<button class="btn primary" data-act="quiz">Start the quiz</button>';
    else html += '<button class="btn primary" data-act="home">Done</button>';
    html += '</div>';
    app.innerHTML = html;
  }

  var PROMPTS = { ex: "Which term fits this example?", def: "Which term matches this definition?", term: "What does this term mean?" };

  function renderQuiz() {
    var q = session.questions[session.qi];
    var n = session.questions.length;
    var t = q.term;
    var html = '<div class="topline"><button class="btn ghost" data-act="leave">← Leave quiz</button>' +
      '<span class="muted small">Question ' + (session.qi + 1) + ' of ' + n + '</span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + session.qi + '"><span style="width:' + (session.qi / n * 100) + '%"></span></div>';
    html += '<div class="qhead">' + (q.isNew ? '<span class="tag">New today</span>' : '<span class="tag review">Review · Day ' + (t.di + 1) + '</span>') +
      '<span class="muted small">' + PROMPTS[q.type] + '</span></div>';
    if (q.type === "ex") html += '<p class="qtext ex">' + esc(t.e) + '</p>';
    else if (q.type === "def") html += '<p class="qtext">' + esc(t.d) + '</p>';
    else html += '<p class="qtext term">' + esc(t.t) + '</p>';
    html += '<ol class="options">';
    q.options.forEach(function (o, i) {
      var cls = "opt" + (q.type === "term" ? " defopt" : "");
      if (session.answered) { if (i === q.answer) cls += " right"; else if (i === q.chosen) cls += " wrong"; }
      html += '<li><button class="' + cls + '" data-act="answer" data-i="' + i + '"' + (session.answered ? " disabled" : "") + '>' +
        '<span class="key">' + (i + 1) + '</span><span class="txt">' + esc(q.type === "term" ? o.d : o.t) + '</span></button></li>';
    });
    html += '</ol>';
    if (session.answered) {
      var chosen = q.options[q.chosen];
      html += '<div class="feedback" id="feedback" role="status">';
      if (q.correct) html += '<p class="verdict ok">✓ Right — ' + esc(t.t) + '</p>';
      else html += '<p class="verdict no">✗ The answer is ' + esc(t.t) + '</p>';
      if (q.type === "ex") html += '<p>' + esc(t.d) + '</p>';
      else if (q.type === "def") html += '<p class="muted"><i>e.g. ' + esc(t.e) + '</i></p>';
      else html += '<p class="muted"><i>e.g. ' + esc(t.e) + '</i></p>';
      if (!q.correct && chosen && q.type !== "term") html += '<p class="small muted">You picked ' + esc(chosen.t) + ': ' + esc(chosen.d) + '</p>';
      html += '</div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="next-q" data-act="nextq">' +
        (session.qi + 1 >= n ? "See my score" : "Next question") + '</button></div>';
    }
    app.innerHTML = html;
  }

  function renderResults() {
    var sm = session.summary;
    var pct = sm.score / sm.total;
    var msg = pct === 1 ? "Full marks. Every term will come back later to check it has stuck."
      : pct >= 0.8 ? "Strong work. The terms you missed will come back in your next quizzes."
      : pct >= 0.5 ? "A solid start. Missed terms come back tomorrow, so they will get easier."
      : "These were tough. Reread the terms below; each one you missed will come back tomorrow.";
    var title = session.mode === "day" ? "Day " + (session.di + 1) + " quiz" : "Quick review";
    var html = '<section class="card"><p class="eyebrow">' + esc(title) + '</p>' +
      '<div><span class="mark" aria-label="' + sm.score + ' out of ' + sm.total + '">' + sm.score + '/' + sm.total + '</span></div>' +
      '<p>' + msg + '</p><ul class="tally">';
    sm.rows.forEach(function (r) {
      var ok = r.right === r.total;
      html += '<li><span class="nm">' + esc(r.t.t) + (r.isNew ? "" : ' <span class="muted small">(review)</span>') + '</span>' +
        '<span class="res ' + (ok ? "ok" : "no") + '">' + (ok ? "✓ " : "✗ ") + r.right + '/' + r.total + '</span></li>';
    });
    html += '</ul><div class="row"><button class="btn primary" data-act="home">Back to today</button>' +
      (session.mode === "day" ? '<button class="btn ghost" data-act="revisit" data-day="' + session.di + '">Reread these terms</button>' : "") +
      '</div></section>';
    app.innerHTML = html;
  }

  function glossItems() {
    var q = gloss.q.trim().toLowerCase();
    var list = gloss.filter === "all" ? TERMS : gloss.filter === "shaky" ? learnedTerms().filter(isShaky) : learnedTerms();
    if (q) list = list.filter(function (t) { return (t.t + " " + t.d + " " + (t.a || []).join(" ")).toLowerCase().indexOf(q) >= 0; });
    return list;
  }
  function renderGlossList() {
    var el = document.getElementById("glist"); if (!el) return;
    var items = glossItems();
    if (!items.length) {
      el.innerHTML = '<li class="empty">' + (gloss.filter === "shaky" && !gloss.q ? "Nothing shaky right now. Terms you get wrong in a quiz appear here." :
        (state.day === 0 && gloss.filter === "learned" && !gloss.q ? "Terms appear here as you learn them. Finish Day 1 to start your glossary." : "No terms match that search.")) + '</li>';
      return;
    }
    el.innerHTML = items.map(function (t) {
      var pill = isShaky(t) ? '<span class="pill shaky">needs practice</span>' : (isSolid(t) ? '<span class="pill solid">solid</span>' : "");
      var learnedYet = t.di < state.day;
      return '<li><details><summary><span class="nm">' + esc(t.t) + pill + '</span><span class="meta">Day ' + (t.di + 1) + (learnedYet ? "" : " · coming up") + '</span></summary>' +
        '<div class="body">' + (t.a ? '<p class="aka" style="margin:0">Also called ' + t.a.map(esc).join(", ") + '</p>' : "") +
        '<p class="def" style="font-size:1.05rem">' + esc(t.d) + '</p>' +
        '<figure class="example"><span class="label">Example</span><p>' + esc(t.e) + '</p></figure>' +
        (t.f ? '<p class="small muted">' + esc(t.f) + '</p>' : "") + '</div></details></li>';
    }).join("");
  }
  function renderGlossary() {
    var learned = learnedTerms();
    var shaky = learned.filter(isShaky).length;
    var html = header() + '<section class="card" style="gap:16px"><h1 style="font-size:1.7rem">Glossary</h1>' +
      '<input class="search" id="gsearch" type="search" placeholder="Search terms and definitions" aria-label="Search terms and definitions" value="' + esc(gloss.q) + '">' +
      '<div class="filters" role="group" aria-label="Show">' +
      '<button data-act="gfilter" data-f="learned" aria-pressed="' + (gloss.filter === "learned") + '">Learned (' + learned.length + ')</button>' +
      '<button data-act="gfilter" data-f="shaky" aria-pressed="' + (gloss.filter === "shaky") + '">Needs practice (' + shaky + ')</button>' +
      '<button data-act="gfilter" data-f="all" aria-pressed="' + (gloss.filter === "all") + '">All ' + TOTAL_TERMS + '</button></div></section>' +
      '<ul class="glist" id="glist"></ul>';
    app.innerHTML = html;
    renderGlossList();
  }

  function render() {
    if (view === "lesson" && session) renderLesson();
    else if (view === "quiz" && session) renderQuiz();
    else if (view === "results" && session && session.summary) renderResults();
    else if (view === "glossary") renderGlossary();
    else { view = "home"; renderHome(); }
  }

  // ---------- events ----------
  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-act");
    if (act === "home") { confirmReset = false; session = null; go("home"); }
    else if (act === "glossary") { session = null; go("glossary"); }
    else if (act === "lesson") startLesson("day", state.day);
    else if (act === "relesson") { session = { mode: "day", di: state.day, step: 0 }; go("lesson"); }
    else if (act === "early") startLesson("day", state.day);
    else if (act === "revisit") startLesson("revisit", Number(b.getAttribute("data-day")));
    else if (act === "next") setStep(session.step + 1);
    else if (act === "prev") setStep(Math.max(0, session.step - 1));
    else if (act === "quiz") startDayQuiz(session && session.mode === "day" ? session.di : state.day);
    else if (act === "practice") startPractice();
    else if (act === "answer") answer(Number(b.getAttribute("data-i")));
    else if (act === "nextq") nextQ();
    else if (act === "leave") { session = null; go("home"); }
    else if (act === "gfilter") { gloss.filter = b.getAttribute("data-f"); renderGlossary(); }
    else if (act === "reset") { confirmReset = true; renderHome(); }
    else if (act === "reset-no") { confirmReset = false; renderHome(); }
    else if (act === "reset-yes") { confirmReset = false; state = blankState(); persist(); go("home"); }
  });
  app.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "gsearch") { gloss.q = ev.target.value; renderGlossList(); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (view === "quiz" && session) {
      if (!session.answered && /^[1-4]$/.test(ev.key)) { var i = Number(ev.key) - 1; if (i < session.questions[session.qi].options.length) { ev.preventDefault(); answer(i); } }
      else if (session.answered && ev.key === "Enter" && !(ev.target && ev.target.tagName === "BUTTON")) { ev.preventDefault(); nextQ(); }
    } else if (view === "lesson" && session) {
      if (ev.key === "ArrowRight" && session.step < 4) setStep(session.step + 1);
      else if (ev.key === "ArrowLeft" && session.step > 0) setStep(session.step - 1);
    }
  });

  render();
  initRemote();
})();
</script>
</body>
</html>
